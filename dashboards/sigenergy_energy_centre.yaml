      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: month
        name: This month, from grid-only to your bill
        icon: mdi:chart-waterfall
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const money = v => v === null || !Number.isFinite(v) ? '—' : `${v < 0 ? '−' : ''}$${Math.abs(v).toFixed(2)}`;
              const credit = v => v === null || !Number.isFinite(v) ? '—' : v < 0 ? `$${Math.abs(v).toFixed(2)} credit` : `$${v.toFixed(2)} to pay`;
                          const base = num('sensor.sigenergy_analytics_monthly_baseline_cost');
              const imp  = num('sensor.sigenergy_analytics_monthly_import_cost');
              const exp  = num('sensor.sigenergy_analytics_monthly_export_income');
              const sup  = num('sensor.sigenergy_analytics_monthly_supply_cost');
              const act  = num('sensor.sigenergy_analytics_actual_cost_this_month');
              const ben  = num('sensor.sigenergy_analytics_system_benefit_this_month');
              if ([base, imp, exp, sup].some(v => v === null)) return '<div class="empty">Monthly cost sensors are unavailable.</div>';

              const A = base + sup, B = Math.max(0, base - imp), C = exp, R = A - B - C;
              const hi = Math.max(A, 0), lo = Math.min(R, 0), span = Math.max(0.01, hi - lo);
              const W = 640, top = 26, bot = 186, H = bot - top;
              const y = v => top + (hi - v) / span * H;
              const steps = [
                ['Grid-only', 0, A, 'base'],
                ['Imports avoided', A, A - B, 'save'],
                ['Feed-in credit', A - B, R, 'fit'],
                ['Your bill', 0, R, R < 0 ? 'credit' : 'bill']
              ];
              const bw = 96, gap = (W - bw * 4) / 4;
              const bars = steps.map((s, i) => {
                const x = gap / 2 + i * (bw + gap), y1 = y(Math.max(s[1], s[2])), hgt = Math.max(2, Math.abs(y(s[1]) - y(s[2])));
                const val = i === 1 || i === 2 ? -(s[1] - s[2]) : s[2];
                const conn = i < 3 ? `<line class="cn" x1="${x + bw}" y1="${y(s[2])}" x2="${x + bw + gap}" y2="${y(s[2])}"/>` : '';
                return `<rect class="${s[3]}" x="${x}" y="${y1}" width="${bw}" height="${hgt}" rx="6"/>${conn}
                  <text class="v" x="${x + bw / 2}" y="${y1 - 7}" text-anchor="middle">${i === 3 ? credit(val) : money(val)}</text>
                  <text class="n" x="${x + bw / 2}" y="${bot + 24}" text-anchor="middle">${s[0]}</text>`;
              }).join('');

              const notes = [];
              if (act !== null && Math.abs(R - act) > 0.05) notes.push(`The parts add up to ${credit(R)} but the bill sensor says ${credit(act)}. Fees or adjustments may not be shown here.`);
              if (ben !== null && Math.abs(B + C - ben) > 0.05) notes.push(`Avoided imports plus feed-in come to ${money(B + C)} but the benefit sensor says ${money(ben)}.`);

              const d = new Date(), dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
              const elapsed = (d.getDate() - 1) + (d.getHours() * 60 + d.getMinutes()) / 1440;
              const pace = elapsed >= 3 && act !== null ? act / elapsed * dim : null;

              return `<div class="wf">
                <svg viewBox="0 0 ${W} ${bot + 34}" width="100%"><line class="zero" x1="0" y1="${y(0)}" x2="${W}" y2="${y(0)}"/>${bars}</svg>
                <div class="foot">
                  <span>Grid-only = what this month's usage would have cost from the grid, plus supply (${money(sup)}).</span>
                  ${pace !== null ? `<b>On pace for about ${credit(pace)} by month end (estimate).</b>` : ''}
                </div>
                ${notes.map(n => `<div class="note">${n}</div>`).join('')}
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: This month, from grid-only to your bill', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">This month, from grid-only to your bill couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .wf{height:100%;display:flex;flex-direction:column;gap:6px}

          .wf svg .zero{stroke:rgba(201,211,228,0.33);stroke-width:1}

          .wf svg
          .cn{stroke:rgba(201,211,228,0.385);stroke-width:1;stroke-dasharray:4
          4}

          .wf svg rect.base{fill:#8d9ab3}

          .wf svg rect.save{fill:#3ee08f;filter:drop-shadow(0 0 8px
          rgba(62,224,143,0.45))}

          .wf svg rect.fit{fill:#8ea6ff;filter:drop-shadow(0 0 8px
          rgba(142,166,255,0.45))}

          .wf svg rect.credit{fill:#3ee08f;filter:drop-shadow(0 0 10px
          rgba(62,224,143,0.55))}

          .wf svg rect.bill{fill:#ff6b6b;filter:drop-shadow(0 0 10px
          rgba(255,107,107,0.5))}

          .wf svg text.v{fill:#eef3fb;font-size:15px;font-weight:800}

          .wf svg text.n{fill:rgba(201,211,228,0.715);font-size:13px}

          .foot{display:flex;flex-direction:column;gap:3px}

          .foot span{font-size:11px;color:rgba(201,211,228,0.55)}

          .foot b{font-size:12.5px;color:#3ee08f}

          .note{padding:6px
          9px;border-radius:9px;background:rgba(255,194,74,0.25);border:1px
          solid rgba(255,194,74,0.3);color:#ffb547;font-size:11px}

          .empty{padding:40px
          10px;text-align:center;font-size:12px;color:rgba(201,211,228,0.66)}
        variables: {}
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: pay
        name: Payback
        icon: mdi:bullseye-arrow
        custom_fields:
          body: >
            [[[

            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const money = (v, d = 2) => v === null ? '—' : `${v < 0 ? '−' : ''}$${Math.abs(v).toFixed(d)}`;
              const pct  = num('sensor.sigenergy_analytics_payback_percent');
              const ben  = num('sensor.sigenergy_analytics_system_benefit_lifetime');
              const cost = num('sensor.sigenergy_analytics_system_cost');
              const rem  = num('sensor.sigenergy_analytics_system_cost_remaining');
              const avg  = num('sensor.sigenergy_analytics_average_benefit_per_day');
              const profit = num('sensor.sigenergy_analytics_lifetime_profit');
              const dRaw = states['sensor.sigenergy_analytics_projected_payback_date']?.state || '';
            const dP = /^(\d{4})-(\d{2})-(\d{2})/.exec(dRaw);

            const date = dP ? new Date(+dP[1], +dP[2] - 1,
            +dP[3]).toLocaleDateString('en-AU', {month: 'long', year:
            'numeric'}) : (dRaw || '—');
              const conf = states['sensor.sigenergy_analytics_payback_projection_confidence']?.state || '—';
              const season = String(states['sensor.sigenergy_analytics_current_season']?.state || '').toLowerCase();
              const yrs = rem !== null && avg ? rem / (avg * 365) : null;
              const sunny = season.includes('spring') || season.includes('summer');
              const p = Math.max(0, Math.min(100, pct ?? 0));
              return `<div class="pb">
                <div class="top"><b>${date}</b><span>projected payoff, ${yrs === null ? '—' : 'about ' + yrs.toFixed(1) + ' years from now'}</span></div>
                <div class="arc"><svg viewBox="0 0 140 78"><path d="M10,72 A60,60 0 0 1 130,72" class="tk"/><path d="M10,72 A60,60 0 0 1 130,72" class="pg" style="stroke-dasharray:${(188.5 * p / 100).toFixed(1)} 188.5"/></svg><b>${pct === null ? '—' : pct.toFixed(1) + '%'}</b><span>paid back</span></div>
                <div class="lbl"><span>${money(ben, 0)} of ${money(cost, 0)}</span><b>${pct === null ? '—' : pct.toFixed(1) + '%'}</b></div>
                <p><span>Still to recover</span><b>${money(rem, 0)}</b></p>
                <p><span>Profit after payback</span><b>${money(profit, 0)}</b></p>
                <p><span>Confidence</span><b>${conf}</b></p>
                ${sunny ? '<small>Your data so far is mostly from spring and summer. Winter days earn less, so expect this date to move later.</small>' : ''}
              </div>`;

            } catch (err) {
