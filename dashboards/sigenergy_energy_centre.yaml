          suffix: ' EFC'
      - type: custom:button-card
        template: sig_kpi
        view_layout:
          grid-area: k6
        entity: sensor.sigenergy_analytics_battery_throughput_today
        name: Throughput today
        icon: mdi:infinity
        variables:
          accent: '#3ee08f'
          suffix: ' kWh'
          decimals: 1
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: hero
        name: Battery now
        icon: mdi:battery-charging-high
        variables:
          reserve_soc: 10
        custom_fields:
          body: >
            [[[

            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const f = (v, d = 1) => v === null ? '—' : v.toFixed(d);
              const clamp = v => Math.max(0, Math.min(100, v ?? 0));
              const hm = h => { if (!Number.isFinite(h) || h <= 0) return null; const m = Math.round(h * 60);
                                return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
              const soc = num('sensor.sigen_plant_battery_state_of_charge');
              const cap = num('sensor.sigen_plant_rated_energy_capacity');
              const bp  = num('sensor.sigen_plant_battery_power');
              const mn  = num('sensor.sigenergy_analytics_soc_minimum_last_24h');
              const mx  = num('sensor.sigenergy_analytics_soc_maximum_last_24h');
              const rc  = num('sensor.sigen_plant_ess_rated_charging_power');
              const rd  = num('sensor.sigen_plant_ess_rated_discharging_power');
              const pc  = num('sensor.sigenergy_analytics_peak_charge_power_last_24h');
              const pd  = num('sensor.sigenergy_analytics_peak_discharge_power_last_24h');
              const mode = states['sensor.sigen_plant_ems_work_mode']?.state || '—';
              const rsv = (() => {
              const pick = re => { const id = Object.keys(states).find(k => /^(number|sensor|input_number)\./.test(k) && /sigen/.test(k) && re.test(k));
                const v = id ? parseFloat(states[id].state) : NaN; return Number.isFinite(v) && v >= 0 && v <= 100 ? {id, v} : null; };
              const b = pick(/backup.*(soc|state_of_charge)/), c = pick(/discharg.*cut.?off.*(soc|state_of_charge)/);
              const fb = Number(variables.reserve_soc ?? 10);
              return {b, c, found: !!(b || c), floor: (b || c) ? Math.max(b ? b.v : 0, c ? c.v : 0) : fb, cutoff: c ? c.v : (b ? 0 : fb)};
            })();

            const reserve = rsv.floor;
              const stored = soc !== null && cap !== null ? cap * soc / 100 : null;
              const usable = soc !== null && cap !== null ? Math.max(0, cap * (soc - reserve) / 100) : null;
              const kw = Math.abs(bp ?? 0), chg = (bp ?? 0) > 0.05, dis = (bp ?? 0) < -0.05;

              let head, sub = '';
              if (bp === null) head = 'Battery data unavailable';
              else if (chg) { const t = cap !== null && soc !== null ? hm(cap * (100 - soc) / 100 / kw) : null;
                head = `Charging at ${kw.toFixed(2)} kW`; sub = t ? `Full in about ${t} at this rate` : ''; }
              else if (dis) { const t = usable !== null ? hm(usable / kw) : null;
                head = `Discharging at ${kw.toFixed(2)} kW`; sub = t ? `Reaches the ${reserve}% reserve in about ${t} at this rate` : ''; }
              else head = soc !== null && soc >= 99 ? 'Full and idle' : soc !== null && soc <= reserve + 1 ? 'At reserve and idle' : 'Idle';

              const NM = 5, lvl = clamp(soc) / 100 * NM, bc = soc !== null && soc < 20 ? '#ff6b6b' : '#3ee08f';
            const act = chg ? Math.min(NM - 1, Math.floor(lvl)) : dis ?
            Math.max(0, Math.ceil(lvl) - 1) : -1;

            let segs = ''; for (let m = NM - 1; m >= 0; m--) { const fill =
            Math.max(0, Math.min(1, lvl - m));
              segs += `<i class="seg ${m === act ? 'act' : ''}" style="--f:${fill.toFixed(2)}"></i>`; }
            const pb = (lbl, v, max, cls) => `<div
            class="pw"><div><span>${lbl}</span><b>${f(v, 2)} / ${f(max, 1)}
            kW</b></div>
                <i><em class="${cls}" style="width:${max ? clamp(v / max * 100) : 0}%"></em></i></div>`;

              return `<div class="hero">
                <div class="ringwrap">
                  <div class="wallb" style="--bc:${bc}" title="Battery ${soc === null ? '—' : soc.toFixed(0) + '%'}"><i class="led"></i><div class="wbar">${segs}</div></div>
                              <div class="socbig"><b>${soc === null ? '—' : soc.toFixed(0) + '%'}</b><span>${f(stored)} kWh stored</span></div>
                              <span class="mode">${mode}</span>
                </div>
                <div class="side">
                  <div class="st ${chg ? 'chg' : dis ? 'dis' : 'idle'}"><b>${head}</b><small>${sub}</small></div>
                  <div class="facts">
                    <p><span>Usable above reserve</span><b>${f(usable)} kWh</b></p>
                    <p><span>Rated capacity</span><b>${f(cap, 2)} kWh</b></p>
                  </div>
                  <div class="rg">
                    <div class="track"><span class="res" style="width:${clamp(reserve)}%"></span>
                      <span class="band" style="left:${clamp(mn)}%;width:${Math.max(0, clamp(mx) - clamp(mn))}%"></span>
                      <u style="left:${clamp(soc)}%"></u></div>
                    <div class="rgl"><span>Last 24h: ${f(mn, 0)}% to ${f(mx, 0)}%</span><span class="rsrc">${rsv.found ? 'Reserve from ' + [rsv.b && (rsv.b.id + ' = ' + rsv.b.v + '%'), rsv.c && (rsv.c.id + ' = ' + rsv.c.v + '%')].filter(Boolean).join(', ') : 'Reserve assumed, no Sigenergy setting found'}</span><span title="${rsv.found ? 'From ' + [rsv.b && rsv.b.id, rsv.c && rsv.c.id].filter(Boolean).join(' and ') : 'Assumed: no Sigenergy reserve setting found'}">Reserve ${reserve}%${rsv.found ? '' : ' (assumed)'}</span></div>
                  </div>
                  ${pb(chg ? 'Charging now' : dis ? 'Discharging now' : 'Power now', kw, chg ? rc : rd, chg ? 'c' : 'd')}
                  ${pb('Peak charge, 24h', pc, rc, 'c')}
                  ${pb('Peak discharge, 24h', pd, rd, 'd')}
                </div>
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Battery now', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Battery now couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }

            ]]]
        extra_styles: >
          .hero{height:100%;display:grid;grid-template-columns:200px
          minmax(0,1fr);gap:16px;align-items:center}

          .ringwrap{display:flex;flex-direction:column;align-items:center;gap:10px}

          .mode{padding:4px
          10px;border-radius:10px;background:rgba(62,224,143,0.32);color:#3ee08f;font-size:11.5px;font-weight:800;
                text-align:center;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .side{display:flex;flex-direction:column;gap:8px;min-width:0}

          .st b{display:block;font-size:19px;font-weight:800}

          .st small{font-size:12px;color:rgba(201,211,228,0.748)}

          .st.chg b{color:#3ee08f;text-shadow:0 0 12px rgba(62,224,143,0.3)}

          .st.dis b{color:#ffb648;text-shadow:0 0 12px rgba(255,182,72,0.3)}

          .st.idle b{color:#eef3fb}

          .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

          .facts p{margin:0;padding:6px
          9px;border-radius:9px;background:rgba(255,255,255,0.04);display:flex;flex-direction:column}

          .facts span{font-size:11px;color:rgba(201,211,228,0.66)}

          .facts b{font-size:15px}

          .track{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,0.108)}

          .track .res{position:absolute;left:0;top:0;bottom:0;border-radius:6px
          0 0 6px;
                background:repeating-linear-gradient(45deg,rgba(255,107,107,0.45) 0 4px,transparent 4px 8px)}
          .track
          .band{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#3ee08f,#8ea6ff);opacity:.55}

          .track
          u{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1px;border-radius:2px;background:#fff;
                box-shadow:0 0 8px #fff;text-decoration:none}
          .rgl{display:flex;justify-content:space-between;font-size:11px;color:rgba(201,211,228,0.638);margin-top:4px}

          .pw div{display:flex;justify-content:space-between;font-size:11.5px}

          .pw span{color:rgba(201,211,228,0.715)}

          .pw
          i{display:block;height:7px;border-radius:5px;background:rgba(255,255,255,0.132);overflow:hidden;margin-top:3px}

          .pw em{display:block;height:100%;border-radius:5px}

          .pw
          em.c{background:linear-gradient(90deg,#3ee08f,#8ea6ff);box-shadow:0 0
          8px rgba(62,224,143,0.4)}

          .pw
          em.d{background:linear-gradient(90deg,#ffb648,#ff6b6b);box-shadow:0 0
          8px rgba(255,107,107,0.4)}

          @media (max-width:700px){
            .hero{grid-template-columns:1fr}
            .wallb{width:56px;height:128px}
          }


          .wallb{position:relative;width:70px;height:156px;border-radius:16px;background:linear-gradient(180deg,#f2f5f9,#cdd4df);
            box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 12px 24px rgba(0,0,0,.4)}
          .wallb
          .led{position:absolute;left:50%;top:10px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--bc);box-shadow:0
          0 8px var(--bc)}

          .wallb
          .wbar{position:absolute;left:50%;top:26px;bottom:16px;width:14px;margin-left:-7px;display:flex;flex-direction:column;gap:4px}

          .wallb
          .seg{position:relative;flex:1;border-radius:4px;background:rgba(40,52,74,.28);overflow:hidden}

          .wallb
          .seg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--f)
          * 100%);background:var(--bc);box-shadow:0 0 8px var(--bc)}

          .wallb .seg.act::after{animation:sigMod 1.6s ease-in-out infinite}

          @keyframes sigMod{0%,100%{opacity:.3}50%{opacity:1}}

          .socbig{text-align:center}

          .socbig
          b{display:block;font-size:40px;line-height:1;font-weight:200;letter-spacing:-1px;color:#eef3fb;font-variant-numeric:tabular-nums}

          .socbig span{font-size:12px;color:#8d9ab3}

          @media (prefers-reduced-motion: reduce){.wallb
          .seg.act::after{animation:none}}


          .rgl{flex-wrap:wrap;gap:2px
          10px}.rsrc{flex-basis:100%;order:3;font-size:10.5px;color:#6f7c95;word-break:break-all}
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: backup
        name: If the grid goes down
        icon: mdi:shield-home-outline
        variables:
          reserve_soc: 10
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const soc = num('sensor.sigen_plant_battery_state_of_charge'), cap = num('sensor.sigen_plant_rated_energy_capacity');
              const load = num('sensor.sigen_plant_consumed_power');
              const avgDay = parseFloat(states['sensor.sigenergy_analytics_7_day_intelligence']?.attributes?.average_load_per_day_kwh);
              const rsv = (() => {
              const pick = re => { const id = Object.keys(states).find(k => /^(number|sensor|input_number)\./.test(k) && /sigen/.test(k) && re.test(k));
                const v = id ? parseFloat(states[id].state) : NaN; return Number.isFinite(v) && v >= 0 && v <= 100 ? {id, v} : null; };
              const b = pick(/backup.*(soc|state_of_charge)/), c = pick(/discharg.*cut.?off.*(soc|state_of_charge)/);
              const fb = Number(variables.reserve_soc ?? 10);
              return {b, c, found: !!(b || c), floor: (b || c) ? Math.max(b ? b.v : 0, c ? c.v : 0) : fb, cutoff: c ? c.v : (b ? 0 : fb)};
            })();
            const reserve = rsv.cutoff;
              const grid = states['sensor.sigen_plant_grid_connection_status']?.state || '—';
              const usable = soc !== null && cap !== null ? Math.max(0, cap * (soc - reserve) / 100) : null;
              const fmt = h => !Number.isFinite(h) ? '—' : h >= 48 ? `${(h / 24).toFixed(1)} days` : `${h.toFixed(1)} h`;
              const hAvg = usable !== null && Number.isFinite(avgDay) && avgDay > 0 ? usable / (avgDay / 24) : NaN;
              const hNow = usable !== null && load !== null && load > 0.05 ? usable / load : NaN;
              return `<div class="bk">
                <div class="big"><b>${fmt(hAvg)}</b><span>at your typical use, ${Number.isFinite(avgDay) ? (avgDay / 24).toFixed(2) : '—'} kW average</span></div>
                <p><span>At current load (${load === null ? '—' : load.toFixed(2)} kW)</span><b>${fmt(hNow)}</b></p>
                <p><span>Grid connection</span><b>${grid}</b></p>
                <small>Battery only, no solar, down to ${rsv.c ? 'the ' + reserve + '% discharge cut-off set in Sigenergy' : rsv.b ? '0% (no discharge cut-off found)' : 'an assumed ' + reserve + '% (no Sigenergy reserve setting found)'}. Assumes your install is wired for backup.</small>
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: If the grid goes down', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">If the grid goes down couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .bk{height:100%;display:flex;flex-direction:column;gap:4px}

          .big
          b{display:block;font-size:24px;font-weight:800;color:#8ea6ff;text-shadow:0
          0 14px rgba(142,166,255,0.3)}

          .big
          span{display:block;font-size:11px;line-height:1.3;color:rgba(201,211,228,0.66)}

          .bk
          p{margin:0;display:flex;justify-content:space-between;gap:8px;padding:4px
          0;border-bottom:1px solid rgba(255,255,255,0.072);font-size:12px}

          .bk p span{color:rgba(201,211,228,0.715)}

          .bk
          small{margin-top:auto;font-size:10.5px;color:rgba(201,211,228,0.495)}
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: health
        name: Health
        icon: mdi:heart-pulse
        custom_fields:
          body: |
            [[[
            try {

              const s = id => states[id]?.state;
              const num = id => { const v = parseFloat(s(id)); return Number.isFinite(v) ? v : null; };
              const dead = v => v === undefined || v === 'unavailable' || v === 'unknown';
              const soh = num('sensor.sigen_plant_battery_state_of_health');
              const t = num('sensor.sigen_plant_ess_average_cell_temperature');
              const alarms = [s('sensor.sigen_plant_general_alarm_1'), s('sensor.sigen_plant_general_alarm_2'),
                              s('sensor.sigen_plant_general_alarm_3'), s('sensor.sigen_plant_general_alarm_4'),
                              s('sensor.sigen_plant_general_alarm_5'), s('sensor.sigen_plant_general_alarm_6')]
                             .filter(v => !dead(v) && v !== 'No Problem');
              const fw = s('sensor.sigen_inverter_firmware_version') || '—';
              const ok = soh !== null && soh >= 90 && t !== null && t >= 5 && t <= 45 && alarms.length === 0;
              const tpos = t === null ? 0 : Math.max(0, Math.min(100, t / 50 * 100));
              return `<div class="hl"><b class="pill ${ok ? 'good' : 'bad'}">${ok ? 'Healthy' : 'Check'}</b>
                <p><span>State of health</span><b>${soh === null ? '—' : soh.toFixed(1) + '%'}</b></p>
                <p><span>Cell temperature</span><b>${t === null ? '—' : t.toFixed(1) + ' °C'}</b></p>
                <div class="tb"><i style="left:${tpos}%"></i></div>
                <p><span>Inverter alarms</span><b class="${alarms.length ? 'red' : 'grn'}">${alarms.length ? alarms.join('; ') : 'None'}</b></p>
                <p><span>Firmware</span><b>${fw}</b></p></div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Health', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Health couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .hl{position:relative;height:100%;display:flex;flex-direction:column}

          .pill{position:absolute;right:0;top:-29px;padding:3px
