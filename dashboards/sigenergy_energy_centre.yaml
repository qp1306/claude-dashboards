      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: use
        name: How hard it's working
        icon: mdi:battery-sync-outline
        triggers_update:
          - sensor.sigenergy_analytics_battery_throughput_today
          - sensor.sigenergy_analytics_battery_efc_today
          - sensor.sigenergy_analytics_battery_efc_lifetime
        variables:
          warranty_cycles: 0
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const f = (v, d) => v === null ? '—' : v.toFixed(d);
              const rows = [
                ['Today',         num('sensor.sigenergy_analytics_battery_throughput_today'),        num('sensor.sigenergy_analytics_battery_efc_today')],
                ['This week',     num('sensor.sigenergy_analytics_battery_throughput_this_week'),    num('sensor.sigenergy_analytics_battery_efc_this_week')],
                ['This month',    num('sensor.sigenergy_analytics_battery_throughput_this_month'),   num('sensor.sigenergy_analytics_battery_efc_this_month')],
                ['This season',   num('sensor.sigenergy_analytics_battery_throughput_this_season'),  num('sensor.sigenergy_analytics_seasonal_battery_efc')],
                ['This contract', num('sensor.sigenergy_analytics_contract_battery_throughput'),     num('sensor.sigenergy_analytics_contract_battery_efc')],
                ['Lifetime',      num('sensor.sigenergy_analytics_battery_throughput_lifetime'),     num('sensor.sigenergy_analytics_battery_efc_lifetime')]
              ];
              const avgEfc = num('sensor.sigenergy_analytics_average_battery_efc_per_day');
              const life = num('sensor.sigenergy_analytics_battery_efc_lifetime');
              const wc = Number(variables.warranty_cycles || 0);
              const wLine = wc > 0 && life !== null
                ? `<p class="w"><span>Warranty cycles used</span><b>${(life / wc * 100).toFixed(1)}% of ${wc}</b></p>` : '';
              return `<div class="us">
                <div class="th"><span>Period</span><span>Throughput</span><span>Cycles</span></div>
                ${rows.map(r => `<div class="tr2"><span>${r[0]}</span><b>${f(r[1], 1)} kWh</b><b>${f(r[2], 2)}</b></div>`).join('')}
                <p><span>Average per day</span><b>${f(avgEfc, 2)} cycles, about ${avgEfc === null ? '—' : (avgEfc * 365).toFixed(0)} a year</b></p>
                ${wLine}
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: How hard it’s working', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">How hard it’s working couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .us{display:flex;flex-direction:column}

          .th,.tr2{display:grid;grid-template-columns:1.2fr 1fr
          .7fr;align-items:center}

          .th{font-size:11px;color:rgba(201,211,228,0.55);padding-bottom:3px;border-bottom:1px
          solid rgba(255,255,255,0.108)}

          .th span:not(:first-child),.tr2 b{text-align:right}

          .tr2{padding:4px 0;border-bottom:1px solid
          rgba(255,255,255,0.048);font-size:12px}

          .tr2 span{color:rgba(201,211,228,0.77)}

          .tr2:last-of-type b{color:#3ee08f}

          .us p{margin:6px 0
          0;display:flex;justify-content:space-between;gap:8px;font-size:12px}

          .us p span{color:rgba(201,211,228,0.66)}

          .us p b{color:#a78bfa;text-align:right}

          .us p.w b{color:#ffb547}
