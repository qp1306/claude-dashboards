          ha-icon{color:#ffc24a;border-color:rgba(255,194,74,.45);box-shadow:0 0
          24px rgba(255,194,74,.25)}

          .grid{grid-area:grid}.grid ha-icon{color:#8ea6ff}

          .home{grid-area:home}.home ha-icon{color:#e6edff}

          .batt{grid-area:batt}.batt
