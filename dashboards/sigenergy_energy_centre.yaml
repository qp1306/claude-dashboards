          decimals: 2
          sub: |
            [[[
              const v = parseFloat(entity?.attributes?.net_electricity_cost_aud);
              return !Number.isFinite(v) ? '' : v < 0 ? `Bill $${Math.abs(v).toFixed(2)} credit` : `Bill $${v.toFixed(2)} to pay`;
            ]]]
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: cal
        name: Solar calendar
        icon: mdi:calendar-month-outline
        variables:
          icon_color: '#ffc24a'
          weeks: 16
          pv_kw: 35
        triggers_update: all
        custom_fields:
          body: |
            [[[
            try {

              const E = typeof window !== 'undefined' ? window.sigE : null;
              if (!E || E.v !== 3) return '<div class="ld">Loading solar history…</div>';
              const A = E.calIds[0], B = E.calIds[1];
              const MAXW = Number(variables.weeks || 16), CAP = Number(variables.pv_kw || 30) * 9;
              const today = new Date(); today.setHours(0, 0, 0, 0);
              const T = today.getTime(), dow = (today.getDay() + 6) % 7;
              const fetchStart = new Date(E.calStart(MAXW));
              const st = E.stats(typeof hass !== 'undefined' ? hass : null, MAXW === 16 ? 'cal2' : 'cal' + MAXW, E.calIds, fetchStart.getTime(), 3600000);
              if (!st) return '<div class="ld">Loading solar history…</div>';
              if (st.err) return '<div class="ld">Solar history couldn’t be loaded. It will retry within the hour.</div>';
              const read = id => { const m = {}; (st.data[id] || []).forEach(r => {
                const t = typeof r.start === 'number' ? r.start : Date.parse(r.start);
                const v = Number.isFinite(r.max) ? r.max : Number.isFinite(r.change) ? r.change : null;
                if (v !== null && Number.isFinite(t)) { const k = new Date(t); k.setHours(0, 0, 0, 0); m[k.getTime()] = v; } });
                const live = parseFloat(states[id]?.state); if (Number.isFinite(live)) m[T] = live; return m; };
              const ma = read(A), mb = read(B);
              // Two independent counters: if they disagree by more than 10%, trust the lower one and flag the day.
              const day = {}, flag = {};
              new Set(Object.keys(ma).concat(Object.keys(mb))).forEach(k => {
                const a = ma[k], b = mb[k];
                if (a !== undefined && b !== undefined && a > 0 && b > 0) {
                  const lo = Math.min(a, b), hi = Math.max(a, b);
                  day[k] = lo; if (+k < T && hi - lo > Math.max(2, lo * 0.1)) flag[k] = `counters disagreed (${a.toFixed(1)} vs ${b.toFixed(1)} kWh), lower value used`;
                } else {
                  const v = a !== undefined ? a : b;
                  if (v > CAP) flag[k] = `${v.toFixed(1)} kWh is above the ${CAP.toFixed(0)} kWh plausibility limit, left out`;
                  else if (v > 0) day[k] = v;
                }
              });
              const keys = Object.keys(day).map(Number).filter(k => day[k] > 0).sort((x, y) => x - y);
              if (!keys.length) return '<div class="ld">No daily solar statistics yet. This needs long-term statistics for a daily solar sensor.</div>';
              // Start at the week of the first day with data, up to the configured number of weeks.
              const first = new Date(keys[0]), fdow = (first.getDay() + 6) % 7;
              let start = new Date(first.getFullYear(), first.getMonth(), first.getDate() - fdow);
              let W = Math.round((T - dow * 864e5 - start.getTime()) / (7 * 864e5)) + 1;
              if (W > MAXW) { start = fetchStart; W = MAXW; }
              const cols = `grid-template-columns:22px repeat(${W},minmax(10px,40px))`;
              const max = Math.max(...keys.map(k => day[k]));
              const fmtD = t => new Date(+t).toLocaleDateString('en-AU', {weekday: 'short', day: 'numeric', month: 'short'});
              let cells = '', months = '', lastLabel = -9;
              for (let w = 0; w < W; w++) {
                let label = null;
                for (let d = 0; d < 7; d++) { const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d); if (dt.getDate() === 1) label = dt; }
                if (w === 0 && !label) { const nx = new Date(start.getFullYear(), start.getMonth() + 1, 1); if ((nx - start) / (7 * 864e5) >= 2) label = start; }
                if (label && w - lastLabel >= 2) { months += `<span style="grid-column:${w + 2}">${label.toLocaleDateString('en-AU', {month: 'short'})}</span>`; lastLabel = w; }
                for (let d = 0; d < 7; d++) {
                  const t = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d).getTime();
                  const pos = `grid-column:${w + 2};grid-row:${d + 1}`, v = day[t], f = flag[t];
                  if (t > T) { cells += `<i class="fu" style="${pos}"></i>`; continue; }
                  if (v === undefined) { cells += `<i class="na ${f ? 'sus' : ''}" style="${pos}" title="${fmtD(t)}: ${f || 'no data'}"></i>`; continue; }
                  const r = Math.max(0, Math.min(1, v / max));
                  cells += `<i class="${t === T ? 'td' : ''} ${f ? 'sus' : ''}" style="${pos};--c:rgba(255,194,74,${(0.1 + 0.9 * r).toFixed(2)});box-shadow:0 0 ${Math.round(10 * r)}px rgba(255,194,74,${(0.45 * r).toFixed(2)})" title="${fmtD(t)}: ${v.toFixed(1)} kWh${f ? ' — ' + f : ''}"></i>`;
                }
              }
              const done = keys.filter(k => k < T && day[k] >= 1);
              const tot = done.reduce((a, k) => a + day[k], 0), avg = done.length ? tot / done.length : 0;
              const best = done.reduce((a, k) => day[k] > a[1] ? [k, day[k]] : a, [0, 0]);
              const low = done.reduce((a, k) => day[k] < a[1] ? [k, day[k]] : a, [0, Infinity]);
              const fl = Object.keys(flag).map(Number).filter(k => k >= start.getTime()).sort((x, y) => x - y);
              const note = fl.length ? `<div class="nt"><b>${fl.length} day${fl.length > 1 ? 's' : ''} with suspect readings</b> (hatched): ${fl.map(k => `${fmtD(k)}, ${flag[k]}`).join('; ')}.</div>` : '';
              return `<div class="cw">
                <div class="cal"><div class="mo" style="${cols}">${months}</div>
                  <div class="gr" style="${cols}"><span class="dl" style="grid-row:1">M</span><span class="dl" style="grid-row:3">W</span><span class="dl" style="grid-row:5">F</span><span class="dl" style="grid-row:7">S</span>${cells}</div>
                  <div class="sc"><span>Less</span><i style="--c:rgba(255,194,74,.1)"></i><i style="--c:rgba(255,194,74,.4)"></i><i style="--c:rgba(255,194,74,.7)"></i><i style="--c:rgba(255,194,74,1)"></i><span>More</span></div>
                  ${note}</div>
                <div class="cs">
                  <p><span>Best day</span><b>${best[1] ? fmtD(best[0]) : '—'}</b><small>${best[1] ? best[1].toFixed(1) + ' kWh' : ''}</small></p>
                  <p><span>Lowest day</span><b>${Number.isFinite(low[1]) ? fmtD(low[0]) : '—'}</b><small>${Number.isFinite(low[1]) ? low[1].toFixed(1) + ' kWh' : ''}</small></p>
                  <p><span>Daily average</span><b>${avg.toFixed(1)} kWh</b><small>over ${done.length} complete day${done.length === 1 ? '' : 's'}</small></p>
                  <p><span>Total so far</span><b>${tot >= 1000 ? (tot / 1000).toFixed(2) + ' MWh' : tot.toFixed(0) + ' kWh'}</b><small>since ${fmtD(keys[0])}, excluding today</small></p>
                </div></div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Solar calendar', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Solar calendar couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
