      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: trend
        name: Last 7 days
        icon: mdi:chart-bar
        custom_fields:
          body: |
            [[[
            try {

              const a = states['sensor.sigenergy_analytics_7_day_intelligence']?.attributes || {};
              const raw = a.daily_rows_json; let rows = Array.isArray(raw) ? raw : [];
              if (!rows.length && typeof raw === 'string') { try { rows = JSON.parse(raw || '[]'); } catch (e) { rows = []; } }
              if (!rows.length) return '<div class="empty">The 7-day report hasn’t run yet. It refreshes daily at 00:10.</div>';
              const nz = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
              const ch = rows.map(r => nz(r.battery_charge_kwh)), dc = rows.map(r => nz(r.battery_discharge_kwh));
              const max = Math.max(1, ...ch, ...dc);
              const day = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if (!m) return String(s || '');
                return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-AU', {weekday: 'short'}) + ' ' + (+m[3]); };
              const cols = rows.map((r, i) => `<div class="col" title="${r.date}: charged ${ch[i].toFixed(1)} kWh, discharged ${dc[i].toFixed(1)} kWh">
                <div class="bars"><i class="c" style="height:${(ch[i] / max * 100).toFixed(1)}%"></i><i class="d" style="height:${(dc[i] / max * 100).toFixed(1)}%"></i></div>
                <span>${day(r.date)}</span></div>`).join('');
              const tc = ch.reduce((x, v) => x + v, 0), td = dc.reduce((x, v) => x + v, 0);
              const ratio = tc > 0 ? td / tc * 100 : null;
              return `<div class="tr">
                <div class="cols">${cols}</div>
                <div class="lg"><span class="c">Charged ${tc.toFixed(1)} kWh</span><span class="d">Discharged ${td.toFixed(1)} kWh</span>
                  <span>Out ÷ in ${ratio === null ? '—' : ratio.toFixed(0) + '%'}</span><span>${nz(a.battery_efc).toFixed(2)} EFC</span></div>
                <small>Out ÷ in roughly reflects losses, but a fuller or emptier battery at the end of the week shifts it.</small>
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Last 7 days', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Last 7 days couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .tr{display:flex;flex-direction:column;gap:6px}

          .cols{display:flex;gap:4px;height:170px}

          .col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}

          .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px;border-bottom:1px
          solid rgba(255,255,255,0.15)}

