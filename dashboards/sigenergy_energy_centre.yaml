      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: period
        name: Earnings per day
        icon: mdi:calendar-range
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const d = new Date(), MS = 86400000;
              const sod = new Date(d.getFullYear(), d.getMonth(), d.getDate());
              const frac = (d - sod) / MS;
              const dow = (d.getDay() + 6) % 7;                         // Monday = 0
              const dWeek = dow + frac, dMonth = d.getDate() - 1 + frac;
              const m = d.getMonth();                                   // AU seasons: Dec, Mar, Jun, Sep
              const sm = [11, 0, 1].includes(m) ? 11 : [2, 3, 4].includes(m) ? 2 : [5, 6, 7].includes(m) ? 5 : 8;
              const sYear = sm === 11 && m !== 11 ? d.getFullYear() - 1 : d.getFullYear();
              const dSeason = (d - new Date(sYear, sm, 1)) / MS;
              const per = (v, days) => v !== null && days >= 0.5 ? v / days : null;
              const rows = [
                ['This week',   per(num('sensor.sigenergy_analytics_system_benefit_this_week'), dWeek)],
                ['This month',  per(num('sensor.sigenergy_analytics_system_benefit_this_month'), dMonth)],
                ['This season', per(num('sensor.sigenergy_analytics_system_benefit_this_season'), dSeason)],
                ['Run rate',    num('sensor.sigenergy_analytics_average_benefit_per_day')]
              ];
              const max = Math.max(0.01, ...rows.map(r => r[1] ?? 0));
              return `<div class="pd">${rows.map(r => `<div class="r"><span>${r[0]}</span>
                <i><em style="width:${r[1] === null ? 0 : Math.max(2, r[1] / max * 100)}%"></em></i>
                <b>${r[1] === null ? '—' : '$' + r[1].toFixed(2)}</b></div>`).join('')}
                <small>Totals divided by days elapsed, so periods of different lengths compare fairly. Early in a week or month these swing a lot.</small></div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Earnings per day', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Earnings per day couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
