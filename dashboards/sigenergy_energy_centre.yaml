title: Sigenergy Energy Centre
button_card_templates:
  sig_kpi:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    variables:
      accent: '#ffb648'
      prefix: ''
      suffix: ''
      decimals: 2
      attr: ''
      sub: ''
      bill: false
    state_display: |
      [[[
        const raw = variables.attr ? entity?.attributes?.[variables.attr] : entity?.state;
        const v = parseFloat(raw);
        if (!Number.isFinite(v)) return '—';
        const d = Number(variables.decimals ?? 2), p = variables.prefix || '', s = variables.suffix || '';
        if (variables.bill) return v < 0 ? `$${Math.abs(v).toFixed(d)} credit` : `$${v.toFixed(d)}${v > 0 ? ' to pay' : ''}`;
        if (p === '$') return `${v < 0 ? '−' : ''}$${Math.abs(v).toFixed(d)}${s}`;
        return `${p}${v.toFixed(d)}${s}`;
      ]]]
    custom_fields:
      sub: |
        [[[
          if (variables.sub) return `<span>${variables.sub}</span>`;
          if (variables.attr) return '';
          const prev = parseFloat(entity?.attributes?.last_period);
          if (!Number.isFinite(prev)) return `<span>Today so far</span>`;
          const d = Number(variables.decimals ?? 2), p = variables.prefix || '', s = variables.suffix || '';
          const txt = variables.bill ? (prev < 0 ? `$${Math.abs(prev).toFixed(d)} credit` : `$${prev.toFixed(d)}`)
                    : p === '$' ? `${prev < 0 ? '−' : ''}$${Math.abs(prev).toFixed(d)}` : `${prev.toFixed(d)}${s}`;
          return `<span>Yesterday ${txt}</span>`;
        ]]]
    styles:
      card:
        - height: 92px
        - border-radius: 22px
        - padding: 10px 13px 9px
        - background: linear-gradient(160deg, rgba(22,30,48,.78), rgba(12,17,30,.86))
        - backdrop-filter: blur(18px)
        - -webkit-backdrop-filter: blur(18px)
        - border: 1px solid rgba(255,255,255,.07)
        - box-shadow: 0 18px 40px rgba(0,0,0,.35)
        - overflow: hidden
      grid:
        - grid-template-areas: '"i n" "s s" "sub sub"'
        - grid-template-columns: 26px minmax(0, 1fr)
        - grid-template-rows: 18px 32px 16px
        - column-gap: 6px
      icon:
        - width: 19px
        - color: '[[[ return variables.accent ]]]'
      img_cell:
        - justify-self: start
        - align-self: center
        - width: 26px
        - height: 26px
      name:
        - justify-self: start
        - align-self: center
        - font-size: 12px
        - font-weight: 600
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - color: '#c9d3e4'
      state:
        - justify-self: start
        - align-self: center
        - font-size: 24px
        - font-weight: 300
        - letter-spacing: -0.5px
        - white-space: nowrap
        - font-variant-numeric: tabular-nums
        - color: >-
            [[[ return variables.bill && parseFloat(entity?.state) < 0 ?
            '#3ee08f' : '#eef3fb' ]]]
      custom_fields:
        sub:
          - justify-self: start
          - font-size: 11px
          - font-weight: 500
          - line-height: 16px
          - white-space: nowrap
          - overflow: hidden
          - text-overflow: ellipsis
          - max-width: 100%
          - color: '#8d9ab3'
  sig_card:
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: none
    variables:
      icon_color: '#ffb648'
    custom_fields:
      lib: |
        [[[
          if (typeof window !== 'undefined' && (!window.sigE || window.sigE.v !== 3)) {
            const LS = {get(k) { try { return JSON.parse(localStorage.getItem('sigE:' + k) || 'null'); } catch (e) { return null; } },
                        set(k, v) { try { localStorage.setItem('sigE:' + k, JSON.stringify(v)); } catch (e) {} }};
            window.sigE = {
              v: 3, c: {}, busy: {}, memo: {}, keep: ['day5', 'cal2'],
              ws(h, key, msg, startMs, ttlMs) {
                const now = Date.now(), e = this.c[key];
                const fresh = e && e.start === startMs && now - e.at < ttlMs;
                if (!fresh && !this.busy[key] && h && h.callWS) {
                  this.busy[key] = true;
                  h.callWS(msg).then(r => { this.c[key] = {start: startMs, at: Date.now(), data: r || {}}; if (this.keep.includes(key)) LS.set(key, this.c[key]); })
                    .catch(() => { if (!this.c[key] || this.c[key].start !== startMs) this.c[key] = {start: startMs, at: Date.now(), data: {}, err: true}; })
                    .finally(() => { this.busy[key] = false; });
                }
                return e && e.start === startMs ? e : null;
              },
              hist(h, key, ids, startMs, ttlMs) {
                return this.ws(h, key, {type: 'history/history_during_period', start_time: new Date(startMs).toISOString(),
                  end_time: new Date().toISOString(), entity_ids: ids, minimal_response: true, no_attributes: true,
                  significant_changes_only: false}, startMs, ttlMs);
              },
              stats(h, key, ids, startMs, ttlMs, period) {
                return this.ws(h, key, {type: 'recorder/statistics_during_period', start_time: new Date(startMs).toISOString(),
                  end_time: new Date().toISOString(), statistic_ids: ids, period: period || 'day',
                  types: period === '5minute' ? ['mean'] : ['max', 'change']}, startMs, ttlMs);
              },
              dayIds: ['sensor.sigen_plant_pv_power', 'sensor.sigen_plant_consumed_power', 'sensor.sigen_plant_battery_state_of_charge', 'sensor.sigen_plant_grid_export_power'],
              calIds: ['sensor.sigenergy_analytics_daily_pv', 'sensor.sigen_plant_pv_daily_generation'],
              dayStart() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); },
              calStart(weeks) { const t = new Date(); t.setHours(0, 0, 0, 0); const dow = (t.getDay() + 6) % 7;
                return new Date(t.getFullYear(), t.getMonth(), t.getDate() - dow - (weeks - 1) * 7).getTime(); },
              kick(h) {
                if (!h || !h.callWS) return;
                this.stats(h, 'day5', this.dayIds, this.dayStart(), 120000, '5minute');
                this.stats(h, 'cal2', this.calIds, this.calStart(16), 3600000);
              },
              pts(arr) {
                return (arr || []).map(x => {
                  const t = x.lu !== undefined ? x.lu * 1000 : x.lc !== undefined ? x.lc * 1000 : Date.parse(x.last_updated || x.last_changed);
                  return [t, parseFloat(x.s !== undefined ? x.s : x.state)];
                }).filter(p => Number.isFinite(p[0])).sort((a, b) => a[0] - b[0]);
              },
              spts(rows) {
                return (rows || []).map(r => [typeof r.start === 'number' ? r.start : Date.parse(r.start), Number(r.mean)])
                  .filter(p => Number.isFinite(p[0]) && Number.isFinite(p[1])).sort((a, b) => a[0] - b[0]);
              },
              sample(pts, t0, t1, step) {
                const out = []; let i = 0, cur = null;
                for (let t = t0; t <= t1; t += step) {
                  while (i < pts.length && pts[i][0] <= t) { if (Number.isFinite(pts[i][1])) cur = pts[i][1]; i++; }
                  out.push([t, cur]);
                }
                return out;
              }
            };
            // Show the last saved copy instantly after a reload; a fresh fetch replaces it.
            window.sigE.keep.forEach(k => { const s = LS.get(k); if (s && s.data && !s.err) window.sigE.c[k] = s; });
          }
          if (typeof window !== 'undefined' && typeof hass !== 'undefined') window.sigE.kick(hass);
          return '';
        ]]]
    styles:
      card:
        - height: 100%
        - border-radius: 24px
        - padding: 14px 16px
        - background: linear-gradient(160deg, rgba(22,30,48,.78), rgba(12,17,30,.86))
        - backdrop-filter: blur(18px)
        - -webkit-backdrop-filter: blur(18px)
        - border: 1px solid rgba(255,255,255,.07)
        - box-shadow: 0 18px 40px rgba(0,0,0,.35)
        - overflow: hidden
        - color: '#eef3fb'
      grid:
        - grid-template-areas: '"i n" "body body"'
        - grid-template-columns: 30px minmax(0, 1fr)
        - grid-template-rows: 32px 1fr
      img_cell:
        - justify-self: start
        - align-self: center
        - width: 30px
        - height: 30px
        - border-radius: 10px
        - background: rgba(255,255,255,.05)
      icon:
        - width: 18px
        - color: '[[[ return variables.icon_color ]]]'
      name:
        - justify-self: start
        - padding-left: 8px
        - font-size: 15px
        - font-weight: 600
        - color: '#f4f7fc'
      custom_fields:
        lib:
          - display: none
        body:
          - align-self: stretch
          - justify-self: stretch
          - min-width: 0
          - white-space: normal
          - padding-top: 6px
          - text-align: left
  sig_header:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    tap_action:
      action: none
    triggers_update: all
    custom_fields:
      right: |
        [[[
          const s = id => states[id]?.state;
          const dead = v => v === undefined || v === 'unavailable' || v === 'unknown';
          const issues = [];
          if (s('binary_sensor.sigenergy_analytics_data_problem') === 'on') issues.push('Data problem');
          if (s('sensor.sigenergy_analytics_active_contract_validation') !== 'VALID') issues.push('Contract');
          const alarms = [s('sensor.sigen_plant_general_alarm_1'), s('sensor.sigen_plant_general_alarm_2'),
            s('sensor.sigen_plant_general_alarm_3'), s('sensor.sigen_plant_general_alarm_4'),
            s('sensor.sigen_plant_general_alarm_5'), s('sensor.sigen_plant_general_alarm_6')];
          if (alarms.some(a => !dead(a) && a !== 'No Problem')) issues.push('Inverter alarm');
          if ([s('sensor.sigen_plant_pv_power'), s('sensor.sigen_plant_consumed_power'),
               s('sensor.sigen_plant_battery_power'), s('sensor.sigen_plant_battery_state_of_charge')].some(dead)) issues.push('Sensors offline');
          const ok = issues.length === 0;
          const d = new Date();
          const stamp = d.toLocaleDateString('en-AU', {weekday: 'long', day: 'numeric', month: 'long'});
          return `<div class="hr"><span class="tm">${stamp}</span>
            <span class="hp ${ok ? 'ok' : 'bad'}"><i></i><span><b>${ok ? 'System healthy' : 'Check system'}</b>
            <small>${ok ? 'All checks passing' : issues.join(', ')}</small></span></span></div>`;
        ]]]
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: 0
        - padding: 0 6px
        - height: 58px
      grid:
        - grid-template-areas: '"i n right" "i l right"'
        - grid-template-columns: 50px minmax(0, 1fr) auto
        - grid-template-rows: 32px 20px
      img_cell:
        - justify-self: start
        - width: 42px
        - height: 42px
        - border-radius: 13px
        - background: rgba(255,255,255,.05)
      icon:
        - width: 22px
        - color: '#ffb648'
      name:
        - justify-self: start
        - align-self: end
        - font-size: 28px
        - font-weight: 300
        - letter-spacing: -.5px
        - color: '#f4f7fc'
      label:
        - justify-self: start
        - font-size: 12px
        - color: '#8d9ab3'
      custom_fields:
        right:
          - justify-self: end
    extra_styles: >
      .hr{display:flex;align-items:center;gap:12px}

      .tm{color:#8d9ab3;font-size:12.5px;white-space:nowrap}

      .hp{display:flex;align-items:center;gap:9px;padding:8px
      14px;border-radius:16px;
          background:rgba(10,16,32,.42);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
      .hp
      i{width:8px;height:8px;border-radius:50%;background:#3ee08f;box-shadow:0 0
      10px #3ee08f}

      .hp.bad i{background:#ff6b6b;box-shadow:0 0 10px #ff6b6b}

      .hp span{display:flex;flex-direction:column}

      .hp b{font-size:12.5px;font-weight:600;color:#eef3fb}

      .hp small{font-size:11px;color:#8d9ab3;margin-top:1px}

      @media (max-width:700px){ .tm{display:none}
      #name{font-size:22px!important} .hp{padding:6px 10px} }
views:
  - title: Now
    path: now
    icon: mdi:lightning-bolt
    type: custom:grid-layout
    background: >-
      radial-gradient(900px 520px at 12% -8%, rgba(255,194,74,.10), transparent
      60%), radial-gradient(900px 600px at 95% 110%, rgba(62,224,143,.08),
      transparent 60%), #080c16
    layout:
      grid-template-columns: repeat(6, minmax(0, 1fr))
      grid-template-rows: auto auto auto 330px auto auto
      grid-template-areas: |
        "head    head    head    head    head    head"
        "day     day     day     day     day     day"
        "insight insight insight insight insight insight"
        "live    live    live    live    tou     tou"
        "flow    flow    flow    flow    money   money"
        "alerts  alerts  alerts  alerts  alerts  alerts"
      grid-column-gap: 10px
      grid-row-gap: 10px
      margin: 8px 6px 10px
      padding: 0px
      card_margin: 0px
      mediaquery:
        '(min-width: 701px) and (max-width: 1100px)':
          grid-template-rows: auto auto auto 330px auto auto
          grid-template-areas: |
            "head    head    head    head    head    head"
            "day     day     day     day     day     day"
            "insight insight insight insight insight insight"
            "live    live    live    tou     tou     tou"
            "flow    flow    flow    flow    money   money"
            "alerts  alerts  alerts  alerts  alerts  alerts"
        '(max-width: 700px)':
          grid-template-columns: minmax(0, 1fr)
          grid-template-rows: auto
          grid-template-areas: |
            "head"
            "insight"
            "live"
            "day"
            "tou"
            "flow"
            "money"
            "alerts"
    cards:
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: head
        show_icon: false
        show_name: false
        triggers_update: all
        custom_fields:
          body: |
            [[[
            try {

              const s = id => states[id]?.state;
              const num = id => { const v = parseFloat(s(id)); return Number.isFinite(v) ? v : null; };
              const dead = v => v === undefined || v === 'unavailable' || v === 'unknown';
              const d = new Date(), hr = d.getHours();
              const greet = hr < 5 ? 'Good evening' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
              const date = d.toLocaleDateString('en-AU', {weekday: 'long', day: 'numeric', month: 'long'});
              const pv = num('sensor.sigen_plant_pv_power') ?? 0, gi = num('sensor.sigen_plant_grid_import_power') ?? 0;
              const bp = num('sensor.sigen_plant_battery_power') ?? 0, soc = num('sensor.sigen_plant_battery_state_of_charge');
              let line, dot;
              if (gi > 0.2) { line = `Drawing ${gi.toFixed(2)} kW from the grid`; dot = '#ff6b6b'; }
              else if (pv > 0.1) { line = bp > 0.05 ? `Running on sunshine and charging the battery` : soc !== null && soc >= 98 ? 'Running on sunshine, battery full' : 'Running on sunshine'; dot = '#ffc24a'; }
              else { line = `Running on battery${soc !== null ? ', ' + Math.round(soc) + '% left' : ''}`; dot = '#3ee08f'; }
              const tm = (id, def) => { const m = /^(\d{1,2}):(\d{2})/.exec(s(id) || ''); return m ? (+m[1]) * 60 + (+m[2]) : def; };
              const peaks = [[tm('input_datetime.sigenergy_analytics_ui_peak_am_start', 420), tm('input_datetime.sigenergy_analytics_ui_peak_am_end', 540)],
                             [tm('input_datetime.sigenergy_analytics_ui_peak_pm_start', 1020), tm('input_datetime.sigenergy_analytics_ui_peak_pm_end', 1260)]];
              const now = ((d.getUTCHours() + 10) % 24) * 60 + d.getUTCMinutes();
              const dur = m => { const h = Math.floor(m / 60), mm = m % 60; return h ? `${h}h ${String(mm).padStart(2, '0')}m` : `${mm}m`; };
              const inPk = peaks.find(p => now >= p[0] && now < p[1]);
              const next = peaks.map(p => p[0] > now ? p[0] - now : p[0] + 1440 - now).sort((a, b) => a - b)[0];
              const peakTxt = inPk ? `Peak pricing for another ${dur(inPk[1] - now)}.` : `Next peak in ${dur(next)}.`;
              const issues = [];
              if (s('binary_sensor.sigenergy_analytics_data_problem') === 'on') issues.push('Data problem');
              if (s('sensor.sigenergy_analytics_active_contract_validation') !== 'VALID') issues.push('Contract');
              if ([s('sensor.sigen_plant_general_alarm_1'), s('sensor.sigen_plant_general_alarm_2'), s('sensor.sigen_plant_general_alarm_3'),
                   s('sensor.sigen_plant_general_alarm_4'), s('sensor.sigen_plant_general_alarm_5'), s('sensor.sigen_plant_general_alarm_6')]
                   .some(a => !dead(a) && a !== 'No Problem')) issues.push('Inverter alarm');
              if ([s('sensor.sigen_plant_pv_power'), s('sensor.sigen_plant_consumed_power'), s('sensor.sigen_plant_battery_power')].some(dead)) issues.push('Sensors offline');
              const ok = !issues.length;
              const solar = num('sensor.sigenergy_analytics_daily_pv');
              return `<div class="hd">
                <div class="lt"><div class="when">${date}</div><h1>${greet}</h1>
                  <p><span class="dot" style="background:${dot};color:${dot}"></span>${line}. ${peakTxt}</p></div>
                <div class="rt"><div class="big"><b>${solar === null ? '—' : solar.toFixed(1)}</b><span>kWh solar<br>today</span></div>
                  <span class="hp ${ok ? 'ok' : 'bad'}"><i></i>${ok ? 'System healthy' : 'Check: ' + issues.join(', ')}</span></div>
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: This card', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">This card couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        styles:
          card:
            - background: transparent
            - border: 0
            - box-shadow: none
            - backdrop-filter: none
            - padding: 6px 8px 2px
          grid:
            - grid-template-areas: '"body"'
            - grid-template-columns: 1fr
            - grid-template-rows: auto
        extra_styles: >
          .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

          .when{font-size:12px;color:#8d9ab3}

          h1{margin:2px 0
          0;font-size:32px;line-height:1.1;font-weight:300;letter-spacing:-.5px;color:#f4f7fc}

          .lt p{display:flex;align-items:center;gap:8px;margin:8px 0
          0;font-size:14px;color:#c9d3e4}

          .dot{flex:none;width:8px;height:8px;border-radius:50%;box-shadow:0 0
          10px currentColor}

          .rt{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

          .big{display:flex;align-items:flex-end;gap:10px}

          .big
          b{font-size:56px;line-height:.9;font-weight:200;letter-spacing:-2px;color:#ffc24a;font-variant-numeric:tabular-nums;
                 text-shadow:0 0 28px rgba(255,194,74,.25)}
          .big
          span{font-size:12px;line-height:1.25;color:#c9d3e4;padding-bottom:4px}

          .hp{display:inline-flex;align-items:center;gap:7px;padding:5px
          11px;border-radius:999px;font-size:11.5px;font-weight:600;
              color:#c9d3e4;background:rgba(10,16,32,.42);border:1px solid rgba(255,255,255,.1)}
          .hp
          i{width:7px;height:7px;border-radius:50%;background:#3ee08f;box-shadow:0
          0 8px #3ee08f}

          .hp.bad{color:#ffb547;border-color:rgba(255,181,71,.4)}.hp.bad
          i{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b}

          @media (max-width:700px){ h1{font-size:26px} .big b{font-size:44px}
          .rt{align-items:flex-start} }
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: day
        name: Your day
        icon: mdi:chart-areaspline-variant
        triggers_update: all
        custom_fields:
          body: >
            [[[

            try {

              const E = typeof window !== 'undefined' ? window.sigE : null;
              if (!E || E.v !== 3) return '<div class="ld">Loading today’s history…</div>';
              const IDS = {pv: E.dayIds[0], load: E.dayIds[1], soc: E.dayIds[2], exp: E.dayIds[3]};
              const now = new Date(), tn = now.getTime();
              const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
              const HS = typeof hass !== 'undefined' ? hass : null;
            let h = E.stats(HS, 'day5', E.dayIds, t0, 120000, '5minute'),
            fromStats = true;

            // Fall back to raw history only if 5-minute statistics aren't
            available for these sensors.

            if (h && (h.err || !(h.data[E.dayIds[0]] || []).length)) { fromStats
            = false; h = E.hist(HS, 'day', E.dayIds, t0, 300000); }
              if (!h) return '<div class="ld">Loading today’s history…</div>';
              if (h.err) return '<div class="ld">Today’s history couldn’t be loaded. It will retry in a few minutes.</div>';
              const memoKey = `${h.at}|${Math.floor(tn / 60000)}|${states['input_datetime.sigenergy_analytics_ui_peak_am_start']?.state}`;
            if (E.memo.day && E.memo.day.k === memoKey) return E.memo.day.html;

            const STEP = 300000, DAY = 864e5;
              const S = k => { const s = E.sample(fromStats ? E.spts(h.data[IDS[k]]) : E.pts(h.data[IDS[k]]), t0, tn, STEP);
              const live = parseFloat(states[IDS[k]]?.state); if (Number.isFinite(live) && s.length) s[s.length - 1] = [s[s.length - 1][0], live]; return s; };
              const pv = S('pv'), ld = S('load'), soc = S('soc'), ex = S('exp');
              const vals = pv.concat(ld).map(p => p[1] ?? 0);
              const kmax = Math.max(1, ...vals), nice = Math.ceil(kmax / 5) * 5;
              const X = t => ((t - t0) / DAY * 1000).toFixed(1);
              const Y = kw => (196 - Math.max(0, kw) / nice * 186).toFixed(1);
              const YS = p => (196 - Math.max(0, Math.min(100, p)) / 100 * 186).toFixed(1);
              const area = `M${X(t0)},196 ` + pv.map(p => `L${X(p[0])},${Y(p[1] ?? 0)}`).join(' ') + ` L${X(pv[pv.length - 1][0])},196 Z`;
              const line = arr => arr.filter(p => p[1] !== null).map((p, i) => `${i ? 'L' : 'M'}${X(p[0])},${Y(p[1])}`).join(' ');
              const sline = soc.filter(p => p[1] !== null).map((p, i) => `${i ? 'L' : 'M'}${X(p[0])},${YS(p[1])}`).join(' ');
              const tfmt = t => new Date(t).toLocaleTimeString('en-AU', {hour: 'numeric', minute: '2-digit'});

              // Summary numbers shared with the insight card.
              const full = soc.find(p => p[1] !== null && p[1] >= 99);
              let expAfter = 0; if (full) ex.forEach(p => { if (p[0] > full[0] && p[1] > 0) expAfter += p[1] * STEP / 3.6e6; });
              const pk = pv.reduce((a, p) => (p[1] ?? 0) > a[1] ? [p[0], p[1]] : a, [0, 0]);
              const lastSun = pv.filter(p => (p[1] ?? 0) > 0.5).pop();
              const sv = soc.filter(p => p[1] !== null);
              const lo = sv.reduce((a, p) => p[1] < a[1] ? p : a, [0, 101]), hi = sv.reduce((a, p) => p[1] > a[1] ? p : a, [0, -1]);
              E.daySum = {day: t0, fullAt: full ? full[0] : null, expAfter, lastSun: lastSun ? lastSun[0] : null,
                          socMax: hi[1] >= 0 ? hi[1] : null, still: (pv[pv.length - 1][1] ?? 0) > 0.5};

              // Tariff bands converted from fixed AEST to the viewer's local clock.
              const st = id => states[id]?.state || '';
              const tm = (id, def) => { const m = /^(\d{1,2}):(\d{2})/.exec(st(id)); return m ? (+m[1]) * 60 + (+m[2]) : def; };
              const w = [tm('input_datetime.sigenergy_analytics_ui_peak_am_start', 420), tm('input_datetime.sigenergy_analytics_ui_peak_am_end', 540),
                         tm('input_datetime.sigenergy_analytics_ui_off_peak_start', 660), tm('input_datetime.sigenergy_analytics_ui_off_peak_end', 900),
                         tm('input_datetime.sigenergy_analytics_ui_peak_pm_start', 1020), tm('input_datetime.sigenergy_analytics_ui_peak_pm_end', 1260)];
              const segs = [[0, w[0], 'sh'], [w[0], w[1], 'pk'], [w[1], w[2], 'sh'], [w[2], w[3], 'off'], [w[3], w[4], 'sh'], [w[4], w[5], 'pk'], [w[5], 1440, 'sh']];
              const delta = -now.getTimezoneOffset() - 600;
              let band = '';
              segs.forEach(([a, b, t]) => [-1440, 0, 1440].forEach(k => {
                const x0 = Math.max(0, a + delta + k), x1 = Math.min(1440, b + delta + k);
                if (x1 > x0) band += `<i class="${t}" style="left:${(x0 / 14.4).toFixed(2)}%;width:${((x1 - x0) / 14.4).toFixed(2)}%"></i>`;
              }));

              const nowPct = ((tn - t0) / DAY * 100).toFixed(2);
              const fullPct = full ? ((full[0] - t0) / DAY * 100).toFixed(2) : null;
              const html = `<div class="dy">
                <div class="plot">
                  <span class="ax l">${nice} kW</span><span class="ax r" style="${nowPct > 88 ? 'visibility:hidden' : ''}">100%</span>
                  <svg viewBox="0 0 1000 200" preserveAspectRatio="none">
                    <line x1="0" y1="103" x2="1000" y2="103" class="gl"/><line x1="0" y1="196" x2="1000" y2="196" class="gl"/>
                    <path d="${area}" class="sol"/>
                    <path d="${line(ld)}" class="hom"/>
                    <path d="${sline}" class="bat"/>
                    <rect x="${X(tn)}" y="0" width="${Math.max(0, 1000 - X(tn))}" height="200" class="fut"/>
                  </svg>
                  ${fullPct ? `<span class="fl" style="left:${fullPct}%"></span><span class="flt" style="left:${fullPct}%">Battery full ${tfmt(full[0])}</span>` : ''}
                  <span class="nw" style="left:${nowPct}%"></span><span class="nwt" style="left:${nowPct}%">now</span>
                </div>
                <div class="band">${band}</div>
                <div class="ticks"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
                <div class="foot">
                  <div class="lg"><span class="s">Solar</span><span class="h">House</span><span class="b">Battery %</span><span class="p">Peak</span><span class="o">Off-peak</span></div>
                  <div class="st"><span>Solar peaked at <b>${pk[1].toFixed(1)} kW</b>${pk[1] > 0 ? ' at ' + tfmt(pk[0]) : ''}</span>
                    ${lo[1] <= 100 ? `<span>Battery low <b>${Math.round(lo[1])}%</b> at ${tfmt(lo[0])}</span>` : ''}</div>
                </div></div>`;
            E.memo.day = {k: memoKey, html};

            return html;


            } catch (err) {
              console.error('Energy Centre card failed: Your day', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Your day couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }

            ]]]
        extra_styles: >
          .dy{display:flex;flex-direction:column;gap:6px}

