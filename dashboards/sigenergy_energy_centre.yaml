          .lg{display:flex;flex-wrap:wrap;gap:6px
          16px;font-size:12px;color:rgba(201,211,228,0.825)}

          .lg .c::before,.lg .d::before{content:'●';margin-right:5px}

          .lg .c::before{color:#3ee08f}.lg .d::before{color:#ffb648}

          .tr small{font-size:10.5px;color:rgba(201,211,228,0.495)}

          .empty{padding:30px
          10px;text-align:center;font-size:12px;color:rgba(201,211,228,0.66)}
