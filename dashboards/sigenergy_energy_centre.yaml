      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: live
        name: Live power
        icon: mdi:flash
        variables:
          reserve_soc: 10
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const f = (v, d = 2) => v === null ? '—' : v.toFixed(d);
              const pv = num('sensor.sigen_plant_pv_power'), load = num('sensor.sigen_plant_consumed_power');
              const gi = num('sensor.sigen_plant_grid_import_power'), ge = num('sensor.sigen_plant_grid_export_power');
              const bp = num('sensor.sigen_plant_battery_power'), soc = num('sensor.sigen_plant_battery_state_of_charge');
              const cap = num('sensor.sigen_plant_rated_energy_capacity');
              const rsv = (() => {
              const pick = re => { const id = Object.keys(states).find(k => /^(number|sensor|input_number)\./.test(k) && /sigen/.test(k) && re.test(k));
                const v = id ? parseFloat(states[id].state) : NaN; return Number.isFinite(v) && v >= 0 && v <= 100 ? {id, v} : null; };
              const b = pick(/backup.*(soc|state_of_charge)/), c = pick(/discharg.*cut.?off.*(soc|state_of_charge)/);
              const fb = Number(variables.reserve_soc ?? 10);
              return {b, c, found: !!(b || c), floor: (b || c) ? Math.max(b ? b.v : 0, c ? c.v : 0) : fb, cutoff: c ? c.v : (b ? 0 : fb)};
            })();
            const reserve = rsv.floor, T = 0.05;
              const solarOn = (pv ?? 0) > T, charging = (bp ?? 0) > T, discharging = (bp ?? 0) < -T;
              const importing = (gi ?? 0) > T && (gi ?? 0) >= (ge ?? 0), exporting = (ge ?? 0) > T && (ge ?? 0) > (gi ?? 0);
              const battKw = Math.abs(bp ?? 0), gridKw = importing ? gi : exporting ? ge : Math.max(gi ?? 0, ge ?? 0);
              const hm = h => { if (!Number.isFinite(h) || h <= 0) return null; const m = Math.round(h * 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
              let msg;
              if (pv === null || load === null || bp === null) msg = 'Some live sensors are unavailable, so these figures may be incomplete.';
              else if (charging && importing) msg = `The battery is charging from the grid at ${f(battKw)} kW.`;
              else if (charging) { const t = cap !== null && soc !== null ? hm(cap * (100 - soc) / 100 / battKw) : null; msg = `Solar is covering the house and charging the battery${t ? `. Full in about ${t} at this rate` : ''}.`; }
              else if (discharging) { const t = cap !== null && soc !== null ? hm(Math.max(0, cap * (soc - reserve) / 100) / battKw) : null; msg = `The battery is carrying the house${t ? `, with about ${t} left above the ${reserve}% reserve at this rate` : ''}.`; }
              else if (exporting && soc !== null && soc >= 98) msg = `The battery is full, so surplus solar (${f(ge)} kW) is going to the grid.`;
              else if (exporting) msg = `Exporting ${f(ge)} kW of surplus solar.`;
              else if (importing) msg = `Drawing ${f(gi)} kW from the grid${soc !== null && soc <= reserve + 1 ? ' because the battery is at its reserve' : ''}.`;
              else msg = 'The system is idle and roughly balanced.';
              const ar = (area, on, cls, color) => `<div class="ar ${area} ${cls} ${on ? 'on' : ''}" style="color:${on ? color : 'rgba(141,154,179,.3)'}"></div>`;
              const socW = soc === null ? 0 : Math.max(0, Math.min(100, soc));
              return `<div class="fw"><div class="fg">
                <div class="nd solar"><ha-icon icon="mdi:white-balance-sunny"></ha-icon><span>Solar</span><b>${f(pv)} kW</b></div>
                ${ar('a1 v', solarOn, 'down', '#ffc24a')}
                <div class="nd grid"><ha-icon icon="mdi:transmission-tower"></ha-icon><span>Grid</span><b>${f(gridKw)} kW</b>
                  <small class="${importing ? 'imp' : exporting ? 'exp' : 'idle'}">${importing ? 'importing' : exporting ? 'exporting' : 'idle'}</small></div>
                ${ar('a2 h', importing || exporting, importing ? 'fwd' : 'rev', importing ? '#ff6b6b' : '#8ea6ff')}
                <div class="nd home"><ha-icon icon="mdi:home-variant-outline"></ha-icon><span>Home</span><b>${f(load)} kW</b></div>
                ${ar('a3 h', charging || discharging, charging ? 'fwd' : 'rev', '#3ee08f')}
                <div class="nd batt"><ha-icon icon="mdi:home-battery-outline"></ha-icon><span>Battery ${soc === null ? '—' : soc.toFixed(0) + '%'}</span><b>${f(battKw)} kW</b>
                  <small class="${charging ? 'chg' : discharging ? 'dis' : 'idle'}">${charging ? 'charging' : discharging ? 'supplying' : 'standby'}</small>
                  <i class="socbar"><em style="width:${socW}%"></em></i></div>
              </div><div class="msg">${msg}</div></div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Live power', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Live power couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .fw{height:100%;display:flex;flex-direction:column;gap:10px}

          .fg{flex:1;display:grid;grid-template-columns:minmax(0,1fr)
          minmax(26px,70px) minmax(0,1fr) minmax(26px,70px) minmax(0,1fr);
              grid-template-rows:auto minmax(26px,1fr) auto;grid-template-areas:". . solar . ." ". . a1 . ." "grid a2 home a3 batt";align-items:center;justify-items:center}
          .nd{display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2}

          .nd
          ha-icon{width:24px;height:24px;--mdc-icon-size:24px;padding:10px;border-radius:50%;background:rgba(255,255,255,.05);border:1px
          solid rgba(255,255,255,.1);margin-bottom:5px}

