      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: insight
        show_icon: false
        show_name: false
        triggers_update:
          - sensor.sigen_plant_battery_state_of_charge
          - sensor.sigenergy_analytics_daily_import
          - sensor.sigenergy_analytics_daily_export
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const E = typeof window !== 'undefined' ? window.sigE : null;
              const t0 = new Date(new Date().setHours(0, 0, 0, 0)).getTime();
              const D = E && E.daySum && E.daySum.day === t0 ? E.daySum : null;
              const fit = num('sensor.sigenergy_solar_feed_in_rate'), sh = num('sensor.sigenergy_shoulder_rate');
              const imp = num('sensor.sigenergy_analytics_daily_import'), ss = num('sensor.sigenergy_analytics_self_sufficiency_today');
              const tfmt = t => new Date(t).toLocaleTimeString('en-AU', {hour: 'numeric', minute: '2-digit'});
              let icon = 'mdi:lightbulb-on-outline', title, text;
              if (D && D.fullAt && D.expAfter >= 1) {
                const until = D.still ? 'sunset' : D.lastSun ? tfmt(D.lastSun) : 'sunset';
                const worth = fit !== null ? ` at ${(fit * 100).toFixed(1)}c, worth about $${(D.expAfter * fit).toFixed(2)}` : '';
                const vs = sh !== null ? ` Bought back at shoulder it would cost about $${(D.expAfter * sh).toFixed(2)}.` : '';
                title = `Your battery was full by ${tfmt(D.fullAt)}`;
                text = `After that, about ${D.expAfter.toFixed(0)} kWh went to the grid${worth}.${vs} Anything you can move into ${tfmt(D.fullAt)} to ${until} runs on solar that’s otherwise worth very little.`;
              } else if (imp !== null && imp >= 1) {
                icon = 'mdi:transmission-tower-import';
                title = `You’ve bought ${imp.toFixed(1)} kWh from the grid today`;
                text = `Self-sufficiency is ${ss === null ? '—' : ss.toFixed(1) + '%'}. ${D && D.socMax !== null ? `The battery peaked at ${Math.round(D.socMax)}% today.` : ''}`;
              } else if (D && D.socMax !== null) {
                icon = 'mdi:leaf';
                title = `${ss === null ? 'Almost' : ss.toFixed(1) + '%'} self-powered today`;
                text = `The battery peaked at ${Math.round(D.socMax)}% and has covered the house without the grid${D.fullAt ? '' : ', without filling up'}.`;
              } else if (ss !== null) {
                icon = 'mdi:leaf';
                title = `${ss.toFixed(1)}% self-powered today`;
                text = `You’ve bought ${imp === null ? '—' : imp.toFixed(2)} kWh from the grid so far. More detail appears once today’s history has loaded.`;
              } else {
                title = 'Gathering today’s story';
                text = 'The insight appears once today’s history has loaded.';
              }
              return `<div class="ins"><span class="io"><ha-icon icon="${icon}"></ha-icon></span><div><b>${title}</b><p>${text}</p></div></div>`;

            } catch (err) {
              console.error('Energy Centre card failed: This card', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">This card couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        styles:
          card:
            - border: 1px solid rgba(255,182,72,.28)
