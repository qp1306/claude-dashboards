      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: tou
        name: Tariff today
        icon: mdi:clock-outline
        triggers_update: all
        variables:
          reserve_soc: 10
        custom_fields:
          body: >
            [[[

            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const tm = (id, def) => { const m = /^(\d{1,2}):(\d{2})/.exec(states[id]?.state || ''); return m ? (+m[1]) * 60 + (+m[2]) : def; };
              const amS = tm('input_datetime.sigenergy_analytics_ui_peak_am_start', 420);
              const amE = tm('input_datetime.sigenergy_analytics_ui_peak_am_end', 540);
              const opS = tm('input_datetime.sigenergy_analytics_ui_off_peak_start', 660);
              const opE = tm('input_datetime.sigenergy_analytics_ui_off_peak_end', 900);
              const pmS = tm('input_datetime.sigenergy_analytics_ui_peak_pm_start', 1020);
              const pmE = tm('input_datetime.sigenergy_analytics_ui_peak_pm_end', 1260);
              const order = [amS, amE, opS, opE, pmS, pmE];
              const sane = order.every((v, i) => i === 0 || v >= order[i - 1]);
              const segs = [[0, amS, 'sh'], [amS, amE, 'pk'], [amE, opS, 'sh'], [opS, opE, 'off'],
                            [opE, pmS, 'sh'], [pmS, pmE, 'pk'], [pmE, 1440, 'sh']].filter(x => x[1] > x[0]);
              const NAME = {pk: 'Peak', sh: 'Shoulder', off: 'Off-peak'};
              const RATE = {pk: num('sensor.sigenergy_peak_rate'), sh: num('sensor.sigenergy_shoulder_rate'), off: num('sensor.sigenergy_off_peak_rate')};
              const cents = v => v === null ? '—' : (v * 100).toFixed(2) + 'c';
              const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), mm = m % 60; return h ? `${h}h ${String(mm).padStart(2, '0')}m` : `${mm}m`; };

              // Tariff clock is fixed AEST (UTC+10), whatever the browser's time zone.
              const d = new Date();
              const now = ((d.getUTCHours() + 10) % 24) * 60 + d.getUTCMinutes();
              const all = segs.concat(segs.map(x => [x[0] + 1440, x[1] + 1440, x[2]]));
              const ci = Math.max(0, all.findIndex(x => now >= x[0] && now < x[1]));
              const cur = all[ci];
              let j = ci + 1; while (j < all.length - 1 && all[j][2] === cur[2]) j++;
              const nxt = all[j];

              // Cross-check against the live tariff sensor.
              const live = String(states['sensor.sigenergy_current_tariff']?.state || '').toLowerCase().trim().replace(/[ _]+/g, '-');
              const liveKey = live === 'peak' ? 'pk' : live === 'shoulder' ? 'sh' : live === 'off-peak' ? 'off' : null;
              const nearEdge = Math.min(now - cur[0], cur[1] - now) < 3;
              const mismatch = liveKey && liveKey !== cur[2] && !nearEdge;
              const showKey = liveKey || cur[2];

              // Peak readiness (estimate).
              const soc = num('sensor.sigen_plant_battery_state_of_charge'), cap = num('sensor.sigen_plant_rated_energy_capacity');
              const bp = num('sensor.sigen_plant_battery_power') ?? 0;
              const rsv = (() => {
              const pick = re => { const id = Object.keys(states).find(k => /^(number|sensor|input_number)\./.test(k) && /sigen/.test(k) && re.test(k));
                const v = id ? parseFloat(states[id].state) : NaN; return Number.isFinite(v) && v >= 0 && v <= 100 ? {id, v} : null; };
              const b = pick(/backup.*(soc|state_of_charge)/), c = pick(/discharg.*cut.?off.*(soc|state_of_charge)/);
              const fb = Number(variables.reserve_soc ?? 10);
              return {b, c, found: !!(b || c), floor: (b || c) ? Math.max(b ? b.v : 0, c ? c.v : 0) : fb, cutoff: c ? c.v : (b ? 0 : fb)};
            })();

            const reserve = rsv.floor;
              const a = states['sensor.sigenergy_analytics_7_day_intelligence']?.attributes || {};
              const avg = parseFloat(a.average_load_per_day_kwh);
              const inPeak = cur[2] === 'pk';
              const pk = inPeak ? cur : all.find(x => x[2] === 'pk' && x[0] > now);
              const hrs = pk ? (inPeak ? pk[1] - now : pk[1] - pk[0]) / 60 : 0;
              const need = Number.isFinite(avg) && pk ? avg / 24 * hrs : null;
              const usable = soc !== null && cap !== null ? Math.max(0, cap * (soc - reserve) / 100) : null;
              let lvl = 'na', word = 'No estimate yet';
              if (need !== null && usable !== null) {
                if (usable >= need * 1.25) { lvl = 'good'; word = 'Ready'; }
                else if (usable >= need) { lvl = 'warn'; word = 'Tight'; }
                else { lvl = 'bad'; word = 'Short'; }
                if (!inPeak && pk && lvl !== 'good' && bp > 0.05) {
                  const proj = Math.min(cap * (100 - reserve) / 100, usable + bp * (pk[0] - now) / 60);
                  if (proj >= need) { lvl = 'good'; word = 'On track'; }
                }
              }
              const pct = need && usable !== null ? Math.min(100, usable / need * 100) : 0;
              const when = inPeak ? `Peak now, ends in ${dur(pk[1] - now)}` : pk ? `Next peak in ${dur(pk[0] - now)}` : '';

              const delta = -d.getTimezoneOffset() - 600; let bar = '';
            segs.forEach(([a, b, t]) => [-1440, 0, 1440].forEach(k => { const x0
            = Math.max(0, a + delta + k), x1 = Math.min(1440, b + delta + k);
              if (x1 > x0) bar += `<i class="${t}" style="left:${(x0 / 14.4).toFixed(2)}%;width:${((x1 - x0) / 14.4).toFixed(2)}%"></i>`; }));
            const nowLocal = d.getHours() * 60 + d.getMinutes();
                const tz = delta === 0 ? 'Your clock matches the AEST tariff clock' : 'Shown in your local time';
              const src = states['sensor.sigenergy_analytics_tariff_source_status']?.state || 'unknown';
              let warn = '';
              if (!sane) warn = 'The tariff windows look out of order. Check the contract times.';
              else if (mismatch) warn = `The live tariff says ${NAME[liveKey]} but these windows say ${NAME[cur[2]]}. The timeline may not match the live tariff source (${src}).`;
              const fit = num('sensor.sigenergy_solar_feed_in_rate'), sup = num('sensor.sigenergy_supply_rate');

              return `<div class="tw">
                <div class="nowrow">
                  <div><span class="lb">Now</span><b class="cur ${showKey}">${NAME[showKey]}</b><small>${cents(RATE[showKey])}/kWh</small></div>
                  <div class="nx"><span class="lb">Next</span><b>${NAME[nxt[2]]}</b><small>in ${dur(nxt[0] - now)}</small></div>
                </div>
                <div class="tl"><div class="bar">${bar}</div><u style="left:${(nowLocal / 1440 * 100).toFixed(2)}%"></u></div>
                <div class="ticks"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
                <div class="tz">${tz}</div>
                <div class="rd ${lvl}">
                  <div class="rh"><span>Peak readiness</span><b>${word}</b></div>
                  <small>${when}</small>
                  <i><em style="width:${pct.toFixed(0)}%"></em></i>
                  <small>${usable !== null ? usable.toFixed(1) : '—'} kWh above ${reserve}% reserve, about ${need !== null ? need.toFixed(1) : '—'} kWh needed</small>
                  <small class="fn">Estimate spreads your 7-day average use evenly; evening peaks often need more.</small>
                </div>
                ${warn ? `<div class="warn">${warn}</div>` : ''}
                <div class="ft">Feed-in ${cents(fit)}/kWh, supply ${sup === null ? '—' : '$' + sup.toFixed(2)}/day</div>
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Tariff today', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Tariff today couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }

            ]]]
        styles:
          card:
            - min-height: 300px
        extra_styles: >
          .tw{height:100%;display:flex;flex-direction:column;gap:7px}

          .nowrow{display:flex;justify-content:space-between;align-items:flex-end}

          .nowrow div{display:flex;flex-direction:column}

          .nowrow .nx{align-items:flex-end}

          .lb{font-size:11px;color:rgba(201,211,228,0.66)}

          .nowrow b{font-size:24px;font-weight:300;line-height:1.15}

          .nowrow .nx b{font-size:14px}

          .nowrow small{font-size:11.5px;color:rgba(201,211,228,0.77)}

          .cur.pk{color:#ff6b6b;text-shadow:0 0 12px rgba(255,107,107,0.35)}

          .cur.sh{color:#ffb648;text-shadow:0 0 12px rgba(255,194,74,0.3)}

          .cur.off{color:#3ee08f;text-shadow:0 0 12px rgba(62,224,143,0.3)}

          .tl{position:relative;margin-top:4px}

          .bar{position:relative;height:14px;border-radius:8px;overflow:hidden;box-shadow:inset
          0 0 0 1px rgba(255,255,255,.08)}

