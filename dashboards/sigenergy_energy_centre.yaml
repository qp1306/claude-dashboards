          decimals: 0
          sub: |
            [[[
              const soc = parseFloat(entity?.state), cap = parseFloat(states['sensor.sigen_plant_rated_energy_capacity']?.state);
              return Number.isFinite(soc) && Number.isFinite(cap) ? `${(cap * soc / 100).toFixed(1)} of ${cap.toFixed(1)} kWh` : 'Stored energy —';
            ]]]
      - type: custom:button-card
