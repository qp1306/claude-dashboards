                <p><span>Supply charge</span><b>${$(sup)}</b></p>
                <p class="tot"><span>Your bill today</span><b class="${bill !== null && bill < 0 ? 'cr' : 'pay'}">${credit(bill)}</b></p>
              </div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Today’s money', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Today’s money couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .mo{display:flex;flex-direction:column}

          .hero{margin-bottom:8px}

          .hero
          b{display:block;font-size:40px;line-height:1;font-weight:200;letter-spacing:-1px;color:#3ee08f;text-shadow:0
          0 24px rgba(62,224,143,.25);font-variant-numeric:tabular-nums}

          .hero span{font-size:12px;color:#8d9ab3}

          .mo
          p{margin:0;display:flex;justify-content:space-between;gap:10px;padding:7px
          0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}

          .mo p span{color:#8d9ab3}

          .mo p
          b{font-weight:600;color:#eef3fb;font-variant-numeric:tabular-nums}

          .mo .ex{color:#8ea6ff}

          .mo .tot{border-bottom:0;padding-top:9px}

          .mo .tot span{color:#c9d3e4}

          .mo .cr{color:#3ee08f}.mo .pay{color:#ffb547}
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: alerts
        name: What matters now
        icon: mdi:shield-check-outline
        variables:
          admin_path: /dashboard-test2/diagnostics
        tap_action:
          action: navigate
          navigation_path: '[[[ return variables.admin_path ]]]'
        custom_fields:
          body: >
            [[[

            try {

              const s = id => states[id]?.state;
              const n = id => { const v = parseFloat(s(id)); return Number.isFinite(v) ? v : null; };
              const dead = v => v === undefined || v === 'unavailable' || v === 'unknown';
              const items = []; let checks = 0;
              const add = (lvl, t, m) => items.push([lvl, t, m]);
              checks++; if (s('binary_sensor.sigenergy_analytics_data_problem') === 'on') add('bad', 'Analytics', 'A data problem is active, so financial totals may be wrong.');
              checks++; const cv = s('sensor.sigenergy_analytics_active_contract_validation'); if (cv !== 'VALID') add('bad', 'Contract', `Active contract validation is ${cv ?? 'missing'}.`);
              checks++; const days = n('sensor.sigenergy_analytics_pricing_days_remaining');
              if (days !== null && days <= 0) add('bad', 'Pricing', 'Contract pricing has expired. Load the new rates.');
              else if (days !== null && days <= 30) add('warn', 'Pricing', `Pricing expires in ${days.toFixed(0)} days. Stage the next contract.`);
              checks++; const al = [['1', s('sensor.sigen_plant_general_alarm_1')], ['2', s('sensor.sigen_plant_general_alarm_2')], ['3', s('sensor.sigen_plant_general_alarm_3')],
                ['4', s('sensor.sigen_plant_general_alarm_4')], ['5', s('sensor.sigen_plant_general_alarm_5')], ['6', s('sensor.sigen_plant_general_alarm_6')]].filter(([i, v]) => !dead(v) && v !== 'No Problem');
              if (al.length) add('bad', 'Inverter alarm', al.map(([i, v]) => `Alarm ${i}: ${v}`).join('; '));
              checks++; const err = n('sensor.sigenergy_analytics_daily_energy_balance_error'); if (err !== null && err > 0.25) add('warn', 'Data balance', `Today's energy balance is off by ${err.toFixed(2)} kWh.`);
              checks++; const soh = n('sensor.sigen_plant_battery_state_of_health'); if (soh !== null && soh < 90) add('warn', 'Battery health', `State of health is ${soh.toFixed(1)}%.`);
              checks++; const t = n('sensor.sigen_plant_ess_average_cell_temperature'); if (t !== null && (t < 5 || t > 45)) add('warn', 'Battery temperature', `${t.toFixed(1)} °C is outside the normal range.`);
              checks++; if (s('input_boolean.sigenergy_analytics_rebuild_review') === 'on') add('warn', 'Analytics rebuild', 'The last rebuild priced some hours without a contract record. Check Contract History, then clear the flag in Admin.');
            checks++; const bf =
            s('sensor.sigenergy_analytics_backfill_status'); if (!dead(bf) && bf
            !== 'Complete') add('warn', 'Analytics backfill', `Status: ${bf}.`);
              checks++; const off = [['Solar', s('sensor.sigen_plant_pv_power')], ['House', s('sensor.sigen_plant_consumed_power')], ['Battery', s('sensor.sigen_plant_battery_power')],
                ['SOC', s('sensor.sigen_plant_battery_state_of_charge')], ['Grid import', s('sensor.sigen_plant_grid_import_power')], ['Grid export', s('sensor.sigen_plant_grid_export_power')],
                ['Tariff', s('sensor.sigenergy_current_tariff')]].filter(([k, v]) => dead(v)).map(([k]) => k);
              if (off.length) add('warn', 'Sensors offline', `${off.join(', ')} unavailable.`);
              const probs = items.sort((x, y) => (x[0] === 'bad' ? 0 : 1) - (y[0] === 'bad' ? 0 : 1));
              const info = [];
              if (n('sensor.sigenergy_analytics_reconciled_bills_count') === 0) info.push(['info', 'Retailer bill', 'No bill checked yet. Add your first one when it arrives.']);
              info.push(['info', 'Tariff source', s('sensor.sigenergy_analytics_tariff_source_status') ?? 'unknown']);
              const rows = (probs.length ? probs : [['good', 'All clear', `All ${checks} checks passed.`]]).concat(info);
              return `<div class="mt">${rows.map(x => `<p class="${x[0]}"><i></i><span><b>${x[1]}</b><small>${x[2]}</small></span></p>`).join('')}</div>`;

            } catch (err) {
              console.error('Energy Centre card failed: What matters now', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">What matters now couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }

            ]]]
        styles:
          card:
            - height: auto
        extra_styles: >
