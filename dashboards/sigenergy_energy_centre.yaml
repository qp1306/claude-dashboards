                ${worst ? `<small>Biggest energy gap: ${worst[0]}, ${worst[1] > 0 ? '+' : ''}${worst[1].toFixed(2)} kWh</small>` : ''}
                <footer>${count} bill${count === 1 ? '' : 's'} checked. Open admin to add another.</footer></div>`;

