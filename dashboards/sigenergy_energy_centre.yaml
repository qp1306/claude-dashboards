      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: flow
        name: Where today’s energy went
        icon: mdi:source-branch
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? Math.max(0, v) : null; };
              const pv = num('sensor.sigenergy_analytics_daily_pv'), load = num('sensor.sigenergy_analytics_daily_load');
              const imp = num('sensor.sigenergy_analytics_daily_import'), exp = num('sensor.sigenergy_analytics_daily_export');
              const ch = num('sensor.sigenergy_analytics_daily_battery_charge'), dis = num('sensor.sigenergy_analytics_daily_battery_discharge');
              if ([pv, load, imp, exp, ch, dis].some(v => v === null)) return '<div class="ld">Today’s energy totals are unavailable.</div>';
              if (pv + dis + imp < 0.05) return '<div class="ld">Nothing to show yet today.</div>';
              const sExp = Math.min(exp, pv), sBat = Math.min(ch, Math.max(0, pv - sExp)), sHome = Math.max(0, pv - sExp - sBat);
              const L = [['Solar', sHome + sBat + sExp, '#ffc24a'], ['Battery', dis, '#3ee08f'], ['Grid', imp, '#ff6b6b']];
              const R = [['Home', sHome + dis + imp, '#e6edff'], ['Battery', sBat, '#3ee08f'], ['Export', sExp, '#8ea6ff']];
              const flows = [[0, 0, sHome], [0, 1, sBat], [0, 2, sExp], [1, 0, dis], [2, 0, imp]];
              const top = 8, gap = 10, H = 184;
              const tot = Math.max(L.reduce((a, n) => a + n[1], 0), R.reduce((a, n) => a + n[1], 0));
              const k = (H - gap * 2) / Math.max(0.01, tot);
              const hgt = v => v > 0 ? Math.max(2.5, v * k) : 0;
              const lay = arr => { let y = top; return arr.map(n => { const o = {y, h: hgt(n[1])}; y += o.h + (n[1] > 0 ? gap : 0); return o; }); };
              const LP = lay(L), RP = lay(R), lo = LP.map(p => p.y), ro = RP.map(p => p.y);
              const x0 = 112, x1 = 348, xm = 230;
              let paths = '';
              flows.forEach(([a, b, v]) => { if (v <= 0) return; const hh = hgt(v);
                const ya = lo[a], yb = ro[b]; lo[a] += hh; ro[b] += hh;
                paths += `<path d="M${x0},${ya} C${xm},${ya} ${xm},${yb} ${x1},${yb} L${x1},${yb + hh} C${xm},${yb + hh} ${xm},${ya + hh} ${x0},${ya + hh} Z" fill="${L[a][2]}" fill-opacity="${a === 2 ? .7 : .32}"/>`; });
              const fmt = v => v >= 10 ? v.toFixed(0) : v.toFixed(1);
              const nodes = L.map((n, i) => n[1] > 0 ? `<rect x="${x0 - 8}" y="${LP[i].y}" width="8" height="${LP[i].h}" rx="3" fill="${n[2]}"/>
                  <text x="${x0 - 14}" y="${LP[i].y + LP[i].h / 2 + 5}" text-anchor="end" fill="${n[2]}">${n[0]} <tspan fill="#c9d3e4">${fmt(n[1])}</tspan></text>` : '').join('')
                + R.map((n, i) => n[1] > 0 ? `<rect x="${x1}" y="${RP[i].y}" width="8" height="${RP[i].h}" rx="3" fill="${n[2]}"/>
                  <text x="${x1 + 14}" y="${RP[i].y + RP[i].h / 2 + 5}" fill="${n[2]}">${n[0]} <tspan fill="#c9d3e4">${fmt(n[1])}</tspan></text>` : '').join('');
              const pct = pv > 0 ? Math.round(sExp / pv * 100) : 0;
              return `<div class="fl"><svg viewBox="0 0 460 200" role="img" aria-label="Today's energy flow in kWh">${paths}${nodes}</svg>
                <p>kWh today. ${pct}% of today’s solar was exported. Assumes the battery charged from solar and exports came from solar.</p></div>`;

            } catch (err) {
              console.error('Energy Centre card failed: Where today’s energy went', err);
              return `<div style="padding:14px;border-radius:12px;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);font-size:12px;line-height:1.5;color:#c9d3e4;text-align:left"><b style="color:#ff6b6b">Where today’s energy went couldn’t draw.</b><br>${String(err && err.message || err).replace(/</g, '&lt;')}<br><span style="color:#8d9ab3">${String(err && err.stack || '').split('\n').slice(1, 3).join(' ').replace(/</g, '&lt;')}</span></div>`;
            }
            ]]]
        extra_styles: >
          .fl{display:flex;flex-direction:column;align-items:center;gap:6px}

          .fl svg{width:100%;max-width:560px;height:auto;overflow:visible}

          .fl text{font-size:15px;font-weight:600}

          .fl p{margin:0;align-self:stretch;font-size:11px;color:#6f7c95}

          .ld{padding:40px
          10px;text-align:center;font-size:12.5px;color:#8d9ab3}
      - type: custom:button-card
        template: sig_card
        view_layout:
          grid-area: money
        name: Today’s money
        icon: mdi:piggy-bank-outline
        variables:
          icon_color: '#3ee08f'
        custom_fields:
          body: |
            [[[
            try {

              const num = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
              const ben = num('sensor.sigenergy_analytics_system_benefit_today');
              const fi = num('sensor.sigenergy_analytics_daily_export_income');
              const ic = num('sensor.sigenergy_analytics_daily_import_cost');
              const sup = num('sensor.sigenergy_supply_rate');
              const bill = num('sensor.sigenergy_analytics_actual_cost_today');
              const $ = v => v === null ? '—' : '$' + Math.abs(v).toFixed(2);
              const credit = v => v === null ? '—' : v < 0 ? `$${Math.abs(v).toFixed(2)} credit` : `$${v.toFixed(2)} to pay`;
              const avoided = ben !== null && fi !== null ? ben - fi : null;
              return `<div class="mo">
                <div class="hero"><b>${$(ben)}</b><span>saved by solar and battery</span></div>
                <p><span>Imports avoided</span><b>${$(avoided)}</b></p>
                <p><span>Feed-in earned</span><b class="ex">${$(fi)}</b></p>
