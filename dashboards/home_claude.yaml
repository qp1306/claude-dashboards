  hm_health:
    template: hm_base
    custom_fields:
      body: >-
        [[[

        const NA=['unknown','unavailable','none',''];

        const num=(id)=>{if(!id)return null;const
        o=states[id];if(!o||NA.includes(String(o.state).toLowerCase()))return
        null;const n=Number(o.state);return Number.isFinite(n)?n:null;};

        const reg=(typeof
        hass!=='undefined'&&hass&&hass.entities)?hass.entities:{};

        const devOf=(id)=>id&&reg[id]?reg[id].device_id:null;

        const find=(d,dom,test,diag)=>{const
        did=devOf(d.temp)||devOf(d.wifi)||devOf(d.power)||devOf(d.entity)||devOf(d.stats);if(!did)return
        null;return
        Object.keys(reg).find(k=>reg[k].device_id===did&&k.startsWith(dom+'.')&&(diag||!reg[k].entity_category)&&states[k]&&test(states[k]))||null;};

        const resolve=(d)=>{const
        r=Object.assign({},d);if(!states[d.entity]){const
        dom=d.entity.split('.')[0];const
        f=find(d,dom,()=>true,false);if(f)r.entity=f;}const
        dc=(o)=>o.attributes.device_class;if(d.power&&!states[d.power]){const
        f=find(d,'sensor',(o)=>dc(o)==='power',true);if(f)r.power=f;}if(d.temp&&!states[d.temp]){const
        f=find(d,'sensor',(o)=>dc(o)==='temperature',true);if(f)r.temp=f;}if(d.wifi&&!states[d.wifi]){const
        f=find(d,'sensor',(o)=>dc(o)==='signal_strength',true);if(f)r.wifi=f;}return
        r;};

        const dev=(d0)=>{const d=resolve(d0);const e=states[d.entity];const
        missing=!e;const s=e?e.state:'missing';const
        pw=num(d.power),tc=num(d.temp),db=num(d.wifi);const
        silent=(d.temp||d.wifi)?(tc===null&&db===null):true;const
        offline=(missing&&silent)||(!missing&&NA.includes(String(s).toLowerCase()));const
        sx=states[d.stats];const
        a=sx&&!NA.includes(String(sx.state).toLowerCase())?sx.attributes:null;const
        an=(k)=>a&&a[k]!==undefined&&a[k]!==null&&a[k]!==''&&Number.isFinite(Number(a[k]))?Number(a[k]):null;const
        clk=states[d.clock]?states[d.clock].state:'unavailable';const
        starts=an('onCount');const rt=an('runtimeSeconds');const
        clockOk=clk==='Healthy';let issue=null;if(offline)issue='offline';else
        if(missing)issue='entity missing';else if(starts===null)issue='no
        stats';else if(!clockOk)issue='clock '+String(clk).toLowerCase();return
        Object.assign({},d,{s,on:s==='on',offline,missing:missing&&!offline,starts,rt,in0:an('input0'),in1:an('input1'),pw,tc,db,clk,clockOk,reporting:!offline&&starts!==null,healthy:issue===null,issue});};

        const all=variables.devices.map(dev);

        const fmt=(n)=>n===null?'—':n.toLocaleString();

        const hrs=(s)=>s===null?'—':(s/3600).toFixed(1)+' h';

        const bad=all.filter(x=>!x.healthy);

        if(!bad.length)return `<div class="ft ok"><span
        class="orb">✓</span><div><b>Everything looks healthy</b><small>All
        ${all.length} Shelly devices are online, clock-synced and
        reporting.</small></div></div>`;

        return `<div class="ft warn"><span
        class="orb">!</span><div><b>${bad.length} device${bad.length>1?'s
        need':' needs'} attention</b><div class="chips">${bad.map(x=>`<span
        class="chip"><ha-icon icon="${x.icon}"></ha-icon>${x.name}:
        ${x.issue}</span>`).join('')}</div></div></div>`;

        ]]]
    extra_styles: >-
      .ft{display:flex;align-items:center;gap:14px;padding:14px
      18px;text-align:left}

      .orb{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900}

      .ft.ok .orb{color:#3ee08f;background:rgba(62,224,143,.12)}

      .ft.warn .orb{color:#ffb547;background:rgba(255,181,71,.14)}

      .ft b{display:block;font-size:14px;font-weight:600;color:#f4f7fc}

      .ft small{display:block;font-size:12px;color:#8d9ab3;margin-top:2px}

      .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}

      .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px
      10px;border-radius:999px;color:#ffcf85;background:rgba(255,181,71,.1)}

      .chip ha-icon{flex:none !important;width:14px !important;height:14px
      !important;--mdc-icon-size:14px !important}

      .ft{position:relative;padding-bottom:22px}

      .ft::after{content:'Home Claude v1.0.4 · 11 Nov 2026 +4
      Shelly';position:absolute;right:16px;bottom:7px;font-size:10px;letter-spacing:.2px;color:#55617a;pointer-events:none}
  hm_garage:
    template: hm_base
    entity: binary_sensor.garage_door_opener_garage_door_closed
    custom_fields:
      body: >-
        [[[

        const G={"closed":
        "binary_sensor.garage_door_opener_garage_door_closed", "online":
        "binary_sensor.garage_door_opener_garage_door_opener", "switch":
        "switch.garage_door_opener_garage_door_open_close_switch", "temp":
        "sensor.garage_door_opener_internal_temperature", "wifi":
        "sensor.garage_door_opener_wifi_signal_sensor"};

        const NA=['unknown','unavailable','none',''];

        const c=states[G.closed];const net=states[G.online];

        const known=c&&!NA.includes(String(c.state).toLowerCase());

        const offline=!known||(net&&net.state==='off');

        const closed=known&&c.state==='on';

        const num=(id)=>{const
        o=states[id];if(!o||NA.includes(String(o.state).toLowerCase()))return
        null;const n=Number(o.state);return Number.isFinite(n)?n:null;};

        const tc=num(G.temp),db=num(G.wifi);

        const since=c&&c.last_changed?(()=>{const
        m=Math.round((Date.now()-Date.parse(c.last_changed))/60000);return
        m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h
        ago':Math.round(m/1440)+' d ago';})():'';

        const state=offline?'Offline':closed?'Closed':'Open';

        const q=db===null?null:db>=-55?4:db>=-67?3:db>=-75?2:db>=-85?1:0;

        const wf=q===null?'':`<span class="wf q${q}" title="Wi-Fi
        ${db.toFixed(0)} dBm"><ha-icon
        icon="mdi:wifi-strength-${q?q:'outline'}"></ha-icon></span>`;

        const tel=(tc!==null?`<span>${tc.toFixed(0)}°C</span>`:'')+wf;

        return `<div class="t gd ${offline?'bad':closed?'shut':'open'}"
        role="button" aria-label="Garage door, ${state}. Tap to
        ${closed?'open':'close'}.">

        <span class="ic"><ha-icon
        icon="${closed||offline?'mdi:garage':'mdi:garage-open-variant'}"></ha-icon></span>

        <div class="tx"><b>Garage Door</b><small>${state}${since&&!offline?' ·
        '+since:''}</small><div class="tel">${tel}</div></div>

        <span class="act">${offline?'':closed?'Tap to open':'Tap to
        close'}</span></div>`;

        ]]]
    tap_action:
      action: call-service
      service: switch.toggle
      service_data:
        entity_id: switch.garage_door_opener_garage_door_open_close_switch
      confirmation:
        text: >-
          [[[ const
          s=states['binary_sensor.garage_door_opener_garage_door_closed']?.state;
          return s==='on' ? 'Open the garage door?' : s==='off' ? 'Close the
          garage door?' : 'The garage door opener is offline or its state is
          unknown. Send the open/close command anyway?'; ]]]
    hold_action:
      action: more-info
    styles:
