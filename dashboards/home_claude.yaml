      version: v1.0.4
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - border-radius: 26px
        - padding: '0'
        - background: linear-gradient(160deg, rgba(22,30,48,.78), rgba(12,17,30,.86))
        - backdrop-filter: blur(18px)
        - -webkit-backdrop-filter: blur(18px)
        - border: 1px solid rgba(255,255,255,.07)
        - box-shadow: 0 18px 40px rgba(0,0,0,.35)
        - color: '#eef3fb'
        - overflow: hidden
      grid:
        - grid-template-areas: '"body"'
        - grid-template-columns: 1fr
      custom_fields:
        body:
          - justify-self: stretch
          - width: 100%
          - text-align: left
  hm_hero:
    template: hm_base
    custom_fields:
      body: >-
        [[[

        const NA=['unknown','unavailable','none',''];

        const num=(id)=>{if(!id)return null;const
        o=states[id];if(!o||NA.includes(String(o.state).toLowerCase()))return
        null;const n=Number(o.state);return Number.isFinite(n)?n:null;};

        const reg=(typeof
        hass!=='undefined'&&hass&&hass.entities)?hass.entities:{};

        const devOf=(id)=>id&&reg[id]?reg[id].device_id:null;

        const find=(d,dom,test,diag)=>{const
        did=devOf(d.temp)||devOf(d.wifi)||devOf(d.power)||devOf(d.entity)||devOf(d.stats);if(!did)return
        null;return
        Object.keys(reg).find(k=>reg[k].device_id===did&&k.startsWith(dom+'.')&&(diag||!reg[k].entity_category)&&states[k]&&test(states[k]))||null;};

        const resolve=(d)=>{const
        r=Object.assign({},d);if(!states[d.entity]){const
        dom=d.entity.split('.')[0];const
        f=find(d,dom,()=>true,false);if(f)r.entity=f;}const
        dc=(o)=>o.attributes.device_class;if(d.power&&!states[d.power]){const
        f=find(d,'sensor',(o)=>dc(o)==='power',true);if(f)r.power=f;}if(d.temp&&!states[d.temp]){const
        f=find(d,'sensor',(o)=>dc(o)==='temperature',true);if(f)r.temp=f;}if(d.wifi&&!states[d.wifi]){const
        f=find(d,'sensor',(o)=>dc(o)==='signal_strength',true);if(f)r.wifi=f;}return
        r;};

        const dev=(d0)=>{const d=resolve(d0);const e=states[d.entity];const
        missing=!e;const s=e?e.state:'missing';const
        pw=num(d.power),tc=num(d.temp),db=num(d.wifi);const
        silent=(d.temp||d.wifi)?(tc===null&&db===null):true;const
        offline=(missing&&silent)||(!missing&&NA.includes(String(s).toLowerCase()));const
        sx=states[d.stats];const
        a=sx&&!NA.includes(String(sx.state).toLowerCase())?sx.attributes:null;const
        an=(k)=>a&&a[k]!==undefined&&a[k]!==null&&a[k]!==''&&Number.isFinite(Number(a[k]))?Number(a[k]):null;const
        clk=states[d.clock]?states[d.clock].state:'unavailable';const
        starts=an('onCount');const rt=an('runtimeSeconds');const
        clockOk=clk==='Healthy';let issue=null;if(offline)issue='offline';else
        if(missing)issue='entity missing';else if(starts===null)issue='no
        stats';else if(!clockOk)issue='clock '+String(clk).toLowerCase();return
        Object.assign({},d,{s,on:s==='on',offline,missing:missing&&!offline,starts,rt,in0:an('input0'),in1:an('input1'),pw,tc,db,clk,clockOk,reporting:!offline&&starts!==null,healthy:issue===null,issue});};

        const all=variables.devices.map(dev);

        const fmt=(n)=>n===null?'—':n.toLocaleString();

        const hrs=(s)=>s===null?'—':(s/3600).toFixed(1)+' h';

        const v=(id)=>{const n=num(id);return n===null?0:n;};

        const pv=v('sensor.sigen_plant_pv_power');

        const gi=v('sensor.sigen_plant_grid_import_power');

        const ge=v('sensor.sigen_plant_grid_export_power');

        const soc=num('sensor.sigen_plant_battery_state_of_charge');

        const bp=Math.abs(v('sensor.sigen_plant_battery_power'));

        const
        chg=states['binary_sensor.sigen_plant_battery_charging']?.state==='on';

        const
        dis=states['binary_sensor.sigen_plant_battery_discharging']?.state==='on';

        const home=Math.max(0,pv+gi-ge+(chg?-bp:dis?bp:0));

        const PVMAX=variables.pv_max||30;

        const kw=(x)=>x>=10?x.toFixed(1):x.toFixed(2);

        const T=0.05;

        const mode=gi>0.2?'grid':pv>0.1?'solar':'battery';


        const now=Date.now(),secs=now/1000;

        const ph=(d,off)=>'-'+((((secs-(off||0))%d)+d)%d).toFixed(2)+'s';

        const kwt=(x)=>(x>=10?x.toFixed(1):x.toFixed(2))+' kW';

        const
        C={solar:'#ffc24a',battery:'#3ee08f',home:'#e6edff',gridOut:'#8ea6ff',gridIn:'#ff6b6b'};

        // ---- sun position from Home Assistant's sun.sun

        const sunE=states['sun.sun'];const A=sunE?sunE.attributes:{};

        const elRaw=Number(A.elevation);const
        el=Number.isFinite(elRaw)?elRaw:(pv>0.1?35:-20);

        const up=sunE?sunE.state==='above_horizon':pv>0.1;

        const
        nr=A.next_rising?Date.parse(A.next_rising):NaN,ns=A.next_setting?Date.parse(A.next_setting):NaN,DAY=864e5;

        let p=0.5;

        if(Number.isFinite(nr)&&Number.isFinite(ns)){if(up){const
        r=nr-DAY;p=(now-r)/Math.max(1,ns-r);}else{const
        s=ns-DAY;p=(now-s)/Math.max(1,nr-s);}}

        p=Math.max(0.03,Math.min(0.97,p));

        // arc: quadratic from (6,70) via (50,-42) to (94,70) in % of the stage,
        peak at 14%

        const GEO={d:[[6,70],[50,-42],[94,70]],m:[[5,82],[50,26],[95,82]]};

        const at=(g,t)=>{const [A,B,Cc]=GEO[g];const
        a=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t],b=[B[0]+(Cc[0]-B[0])*t,B[1]+(Cc[1]-B[1])*t];return
        {q1:a,pt:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]};};

        const SD=at('d',p),SM=at('m',p);

        const P0=GEO.d[0],P1=GEO.d[1],P2=GEO.d[2];

        const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];

        const Q1=lerp(P0,P1,p),Q2=lerp(lerp(P0,P1,p),lerp(P1,P2,p),p);

        const sx=Q2[0],sy=Q2[1];

        // ---- sky colours by sun elevation

        const
        ST=[[-18,'#02050d','#060b1c'],[-10,'#040a1b','#121a3b'],[-4,'#0a1430','#3a2a57'],[0,'#12234f','#b8584a'],[5,'#183872','#f09a5c'],[12,'#16407f','#82b4e0'],[40,'#123f88','#a3cdf2']];

        const
        hx=(h)=>h.startsWith('rgb')?h.match(/\d+/g).slice(0,3).map(Number):[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

        const mix=(a,b,t)=>{const A1=hx(a),B1=hx(b);return
        'rgb('+A1.map((v,i)=>Math.round(v+(B1[i]-v)*t)).join(',')+')';};

        let top=ST[0][1],hor=ST[0][2];

        for(let i=0;i<ST.length-1;i++){const
        [e0,t0,h0]=ST[i],[e1,t1,h1]=ST[i+1];if(el>=e0&&el<=e1){const
        t=(el-e0)/(e1-e0);top=mix(t0,t1,t);hor=mix(h0,h1,t);}}

        if(el>ST[ST.length-1][0]){top=ST[ST.length-1][1];hor=ST[ST.length-1][2];}

        const night=Math.max(0,Math.min(1,(-el-2)/8));

        const golden=up&&el<12?Math.max(0,1-Math.abs(el-3)/9):0;


        const expect=PVMAX*Math.sin(Math.max(el,3)*Math.PI/180)*0.9;

        const
        solarCloud=up?Math.max(0,Math.min(1,1-pv/Math.max(0.5,expect))):null;

        const WE=variables.weather||'weather.forecast_home';const
        wx=states[WE];const wc=wx?String(wx.state):'';const
        wa=wx?wx.attributes:{};

        const
        COND={'cloudy':.9,'fog':.8,'rainy':.85,'pouring':1,'lightning':.9,'lightning-rainy':1,'snowy':.85,'snowy-rainy':.9,'hail':.95,'partlycloudy':.45,'windy-variant':.5,'exceptional':.8,'sunny':.05,'clear-night':.05,'windy':.2};

        const covA=Number(wa.cloud_coverage);

        let
        wcov=Number.isFinite(covA)?covA/100:(COND[wc]!==undefined?COND[wc]:null);

        if(wcov!==null&&COND[wc]!==undefined&&COND[wc]>=.85)wcov=Math.max(wcov,COND[wc]);

        const
        cloud=Math.max(0,Math.min(1,wcov===null?(solarCloud===null?0.25:solarCloud):(solarCloud===null?wcov:Math.max(wcov,solarCloud*0.7))));

        const wind=Number(wa.wind_speed)||0;const tempW=Number(wa.temperature);

        const sunI=up?Math.max(0.3,Math.min(1,pv/(PVMAX*0.55)))*(1-0.6*cloud):0;

        const
        stormy=['lightning','lightning-rainy','pouring','hail'].includes(wc);

        top=mix(top,night>0.5?'#1a1f2b':(stormy?'#3a414f':'#6b7686'),cloud*(stormy?0.7:0.55));hor=mix(hor,night>0.5?'#232a38':(stormy?'#565e6d':'#8d97a6'),cloud*(stormy?0.7:0.6));

        // ---- stars (deterministic), shooting star

        let stars='';

        if(night>0.05){for(let i=0;i<46;i++){const
        x=(i*61.8+17)%100,y=((i*37.3+11)%62),s=1+(i%3)*0.6,d=2.5+(i%5);stars+=`<i
        class="star"
        style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${s}px;height:${s}px;animation-duration:${d}s;animation-delay:${ph(d,i*0.7)}"></i>`;}
         stars+=`<i class="shoot" style="animation-delay:${ph(14)}"></i>`;}
        // ---- clouds

        const
        CL=[[8,18,190,7,90],[34,10,240,5,140],[62,22,200,6,110],[80,8,260,4,170],[18,4,280,6,120],[50,14,300,7,150],[72,26,240,6,100],[2,28,220,5,130],[40,24,260,6,160],[88,16,230,5,115]];

        const ncl=4+Math.round(cloud*6);const spd=1+Math.min(wind,60)/25;

        const cl=CL.slice(0,ncl).map((c,i)=>{const
        d=+(c[4]/spd).toFixed(1);return `<i class="cloud"
        style="left:${c[0]}%;top:${c[1]}%;width:${c[2]}px;height:${c[3]*10}px;animation-duration:${d}s;animation-delay:${ph(d,i*31)};opacity:${(0.12+0.6*cloud).toFixed(2)};background:${up?(cloud>0.7?'rgba(200,206,216,.8)':'rgba(255,255,255,.75)'):'rgba(80,92,125,.6)'}"></i>`;}).join('')+(cloud>0.75?`<i
        class="veil"
        style="opacity:${((cloud-0.75)*2.4).toFixed(2)};background:${up?'rgba(120,128,142,.55)':'rgba(8,11,20,.6)'}"></i>`:'');

        // precipitation, lightning, fog

        const
        RAIN={'rainy':45,'pouring':100,'lightning-rainy':80,'snowy-rainy':35,'hail':55};const
        SNOW={'snowy':55,'snowy-rainy':18};

        const tilt=Math.min(wind,60)/60*30;let wxfx='';

        const nR=RAIN[wc]||0;for(let i=0;i<nR;i++){const
        d=(wc==='hail'?0.55:0.7)+(i%5)*0.08;wxfx+=`<i class="drop
        ${wc==='hail'?'hail':''}"
        style="left:${((i*37.7)%110-5).toFixed(1)}%;--dx:${(tilt*-6).toFixed(0)}px;rotate:${tilt.toFixed(0)}deg;animation-duration:${d.toFixed(2)}s;animation-delay:${ph(d,i*0.137)}"></i>`;}

        const nS=SNOW[wc]||0;for(let i=0;i<nS;i++){const d=5+(i%6)*0.9;wxfx+=`<i
        class="flake"
        style="left:${((i*29.3)%100).toFixed(1)}%;width:${3+(i%3)}px;height:${3+(i%3)}px;animation-duration:${d.toFixed(1)}s;animation-delay:${ph(d,i*0.41)}"></i>`;}

        if(wc==='lightning'||wc==='lightning-rainy')wxfx+=`<i class="flash"
        style="animation-delay:${ph(9)}"></i>`;

        if(wc==='fog')wxfx+=`<i class="fog"></i>`;

        const
        WL={'sunny':['Sunny','mdi:weather-sunny'],'clear-night':['Clear','mdi:weather-night'],'partlycloudy':['Partly
        cloudy','mdi:weather-partly-cloudy'],'cloudy':['Cloudy','mdi:weather-cloudy'],'rainy':['Rain','mdi:weather-rainy'],'pouring':['Heavy
        rain','mdi:weather-pouring'],'lightning':['Storms','mdi:weather-lightning'],'lightning-rainy':['Thunderstorms','mdi:weather-lightning-rainy'],'fog':['Fog','mdi:weather-fog'],'snowy':['Snow','mdi:weather-snowy'],'snowy-rainy':['Sleet','mdi:weather-snowy-rainy'],'hail':['Hail','mdi:weather-hail'],'windy':['Windy','mdi:weather-windy'],'windy-variant':['Windy','mdi:weather-windy-variant'],'exceptional':['Severe
        weather','mdi:alert-outline']};

        const wl=WL[wc];const wxLine=wx&&wl?`<div class="wx"><ha-icon
        icon="${wl[1]}"></ha-icon>${Number.isFinite(tempW)?Math.round(tempW)+'°
        · ':''}${wl[0]}${wind>=1?' · wind '+Math.round(wind)+'
        km/h':''}</div>`:'';

        // ---- energy particles: sun -> roof; house <-> pylon

        let parts='';

        if(up&&pv>T){const f=Math.min(pv/PVMAX,1);const
        n=Math.round(6+f*14);const d=+(2.8-f*1.3).toFixed(2);
         for(let i=0;i<n;i++){const j=((i*29)%11-5)*0.6;parts+=`<i class="pt sun" style="--x0:calc(var(--sx) + ${(j*0.3).toFixed(2)}%);--y0:calc(var(--sy) + 3%);--xm:calc((var(--sx) + var(--hx)) / 2 + ${j.toFixed(2)}%);--ym:calc(min(var(--sy) + 18%, 100% - var(--ry) - 36px) + ${j.toFixed(2)}%);--x1:calc(var(--hx) + var(--rx) + ${(j*4).toFixed(0)}px);--y1:calc(100% - var(--ry));animation-duration:${d}s;animation-delay:${ph(d,i*d/n)}"></i>`;}}
        // battery flow: house -> battery while charging, battery -> house while
        discharging

        if((chg||dis)&&bp>T){const f2=Math.min(bp/10,1);const
        nb=Math.round(4+f2*6);const d=bp<2?2.2:bp<6?1.6:1.15;const toBat=chg;
         const H0='calc(var(--hx) - var(--lx))',H1='calc(100% - var(--ly))',B0='calc(var(--tx) + var(--bx))',B1='calc(100% - var(--by))';
         for(let i=0;i<nb;i++){parts+=`<i class="pt batf" style="--x0:${toBat?H0:B0};--y0:${toBat?H1:B1};--xm:calc((var(--hx) - var(--lx) + var(--tx) + var(--bx)) / 2);--ym:calc(100% - max(var(--ly), var(--by)) - 14px);--x1:${toBat?B0:H0};--y1:${toBat?B1:H1};animation-duration:${d}s;animation-delay:${ph(d,i*d/nb)}"></i>`;}}
        const gk=gi>T?gi:ge;

        if(gi>T||ge>T){const d=gk<2?2.2:gk<8?1.6:1.1;const imp=gi>T;for(let
        i=0;i<6;i++){parts+=`<i class="pt ${imp?'imp':'exp'}"
        style="--x0:${imp?'var(--px)':'calc(var(--hx) +
        var(--wx))'};--y0:${imp?'calc(100% - var(--py))':'calc(100% -
        var(--wy))'};--xm:calc((var(--hx) + var(--px)) / 2 +
        20px);--ym:calc(100% - var(--py) + 4px);--x1:${imp?'calc(var(--hx) +
        var(--wx))':'var(--px)'};--y1:${imp?'calc(100% - var(--wy))':'calc(100%
        -
        var(--py))'};animation-duration:${d}s;animation-delay:${ph(d,i*d/6)}"></i>`;}}

        // ---- scene pieces

        const total=all.length;const lon=all.filter(x=>x.on).length;const
        lw=all.filter(x=>x.pw!==null).reduce((t,x)=>t+x.pw,0);const
        healthy=all.filter(x=>x.healthy).length;

        const lit=(!up||lon>0)?(up?0.55:0.95):0.12;

        const socv=soc===null?0:Math.max(0,Math.min(100,soc));

        const bcol=socv<20?C.gridIn:C.battery;

        const house=`<svg class="house" viewBox="0 0 120 80"
        aria-hidden="true"><path d="M8,40 L60,14 L112,40 L112,78 L8,78 Z"
        fill="#0a1020"></path><path d="M60,14 L112,40 L104,40 L60,18 Z"
        fill="#121a30"></path>

        <path d="M66,22 L104,41 L100,43 L62,24 Z"
        fill="${up?'#2c4f8f':'#1a2a4a'}" class="${up?'glint':''}"
        style="animation-delay:${ph(5)}"></path><path d="M64,27 L98,44 L94,46
        L60,29 Z" fill="${up?'#2c4f8f':'#1a2a4a'}" class="${up?'glint':''}"
        style="animation-delay:${ph(5,0.4)}"></path>

        <rect x="20" y="50" width="16" height="14" rx="1.5" fill="#ffcf85"
        opacity="${lit}"></rect><rect x="46" y="50" width="16" height="14"
        rx="1.5" fill="#ffcf85" opacity="${lit}"></rect><rect x="76" y="52"
        width="12" height="26" rx="1.5" fill="#ffcf85"
        opacity="${(lit*0.8).toFixed(2)}"></rect><rect x="94" y="50" width="12"
        height="14" rx="1.5" fill="#ffcf85" opacity="${lit}"></rect></svg>`;

        const NM=5;const lvl=socv/100*NM;

        const busy=chg&&bp>T?'chg':dis&&bp>T?'dis':'';

        const
        act=busy==='chg'?Math.min(NM-1,Math.floor(lvl)):busy==='dis'?Math.max(0,Math.ceil(lvl)-1):-1;

        let segs='';for(let m=NM-1;m>=0;m--){const
        fill=Math.max(0,Math.min(1,lvl-m));segs+=`<i class="seg
        ${m===act?'act':''}"
        style="--f:${fill.toFixed(2)};animation-delay:${ph(1.6)}"></i>`;}

        const batt=`<div class="wall"
        style="--bc:${bcol};filter:brightness(${(1-0.35*night).toFixed(2)})"
        title="Battery ${Math.round(socv)}%"><i class="led"></i><div
        class="wbar">${segs}</div></div>`;

        const pylon=`<svg class="pylon" viewBox="0 0 40 90"
        aria-hidden="true"><path d="M20,2 L8,88 M20,2 L32,88 M10,74 L30,74
        M13,52 L27,52 M15,32 L25,32 M4,14 L36,14 M8,24 L32,24"
        stroke="${mix('#0b1222','#55658a',night)}" stroke-width="3.2"
        fill="none" stroke-linecap="round"></path></svg>`;

        const hills=`<svg class="hills" viewBox="0 0 1000 100"
        preserveAspectRatio="none" aria-hidden="true"><path d="M0,46 C120,20
        220,30 330,40 C450,52 520,14 640,22 C760,30 860,8 1000,30 L1000,100
        L0,100 Z" fill="${mix('#2a3a66','#0f1a33',night)}"
        opacity=".75"></path><path d="M0,70 C150,46 260,60 400,58 C540,56 600,40
        720,48 C840,56 920,44 1000,52 L1000,100 L0,100 Z"
        fill="${mix('#16233f','#080e1d',night)}"></path></svg>`;

        const arcSvg=(g,S,cls)=>{const [A,B,Cc]=GEO[g];return `<svg class="arc
        ${cls}" viewBox="0 0 100 100" preserveAspectRatio="none"
        aria-hidden="true"><path d="M${A[0]},${A[1]} Q${B[0]},${B[1]}
        ${Cc[0]},${Cc[1]}" fill="none" stroke="rgba(255,255,255,.16)"
        stroke-width="1.2" vector-effect="non-scaling-stroke"></path><path
        d="M${A[0]},${A[1]} Q${S.q1[0].toFixed(2)},${S.q1[1].toFixed(2)}
        ${S.pt[0].toFixed(2)},${S.pt[1].toFixed(2)}" fill="none"
        stroke="${up?'rgba(255,214,140,.75)':'rgba(200,215,255,.45)'}"
        stroke-width="2" vector-effect="non-scaling-stroke"></path></svg>`;};

        const arc=arcSvg('d',SD,'ad')+arcSvg('m',SM,'am');

        const bigEl=(cls)=>`<div class="big
        ${cls}"><b>${up||pv>0.05?(pv>=10?pv.toFixed(1):pv.toFixed(2)):'0'}</b><span>kW
        solar<br>right now</span></div>`;

        const sunLbl=up&&pv>0.05?`<div class="sunlbl ${SD.pt[1]<30?'bd':''}
        "><b>${pv>=10?pv.toFixed(1):pv.toFixed(2)}</b><span>kW solar<br>right
        now</span></div>`:'';

        const orb=up?`<div class="sun"
        style="left:var(--sx);top:var(--sy);--i:${sunI.toFixed(2)};opacity:${(1-0.7*Math.max(0,cloud-0.3)/0.7).toFixed(2)}"><i
        class="rays" style="animation-delay:${ph(60)}"></i><i class="halo"
        style="animation-delay:${ph(5)}"></i><i class="disc"></i></div>`
         :`<div class="moon" style="left:var(--sx);top:var(--sy);opacity:${(1-0.75*cloud).toFixed(2)}"><i class="mglow"></i><i class="mdisc"></i></div>`;
        const glow=`<i class="glow"
        style="left:var(--sx);top:var(--sy);background:radial-gradient(circle,
        ${up?`rgba(255,214,150,${(0.25+0.35*sunI).toFixed(2)})`:'rgba(190,205,255,.10)'}
        0, transparent 70%)"></i>`;

        const skyBg=`radial-gradient(120% 60% at 50% 100%,
        rgba(255,150,90,${(golden*0.55).toFixed(2)}), transparent 70%),
        linear-gradient(180deg, ${top} 0%, ${hor} 82%, ${hor} 100%)`;

        // ---- text

        const hr=new Date(now).getHours();

        const greet=hr<5?'Good evening':hr<12?'Good morning':hr<18?'Good
        afternoon':'Good evening';

        const date=new
        Date(now).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

        const line=gi>0.2?`Drawing ${kwt(gi)} from the grid`:pv>0.1?`Running on
        sunshine${['rainy','pouring','lightning-rainy','snowy-rainy','hail'].includes(wc)?'
        through the rain':cloud>0.55?' through the clouds':''}`:`Running on
        battery${soc!==null?', '+Math.round(socv)+'% left':''}`;

        const W=(typeof window!=='undefined')?window:{};const
        ENT='sensor.sigen_plant_pv_power';

        const dz=new Date(now);dz.setHours(0,0,0,0);const t0=dz.getTime();

        const hc=W.__hmSolarHist;const
        hfresh=hc&&hc.day===t0&&(now-hc.at<300000);

        if(!hfresh&&typeof
        hass!=='undefined'&&hass&&hass.callWS&&!W.__hmSolarBusy){W.__hmSolarBusy=true;
         const q=(a,b)=>hass.callWS({type:'history/history_during_period',start_time:new Date(a).toISOString(),end_time:new Date(b).toISOString(),entity_ids:[ENT],minimal_response:true,no_attributes:true,significant_changes_only:false});
         Promise.all([q(t0,now),q(t0-864e5,t0)]).then(([a,b])=>{W.__hmSolarHist={day:t0,at:Date.now(),today:(a&&a[ENT])||[],yday:(b&&b[ENT])||[]};}).catch(()=>{W.__hmSolarHist={day:t0,at:Date.now(),today:[],yday:[],err:true};}).finally(()=>{W.__hmSolarBusy=false;});}
        const hh=W.__hmSolarHist&&W.__hmSolarHist.day===t0?W.__hmSolarHist:null;

        let pk=[0,0];

        if(hh){hh.today.forEach(e=>{const
        v=parseFloat(e.s!==undefined?e.s:e.state);const
        ts=(e.lu!==undefined?e.lu:e.lc!==undefined?e.lc:Date.parse(e.last_updated||e.last_changed)/1000)*1000;if(Number.isFinite(v)&&v>pk[1])pk=[ts,v];});}

        if(pv>pk[1])pk=[now,pv];

        const peakTxt=pk[1]>0.05?kwt(pk[1])+' · '+new
        Date(pk[0]).toLocaleTimeString([],
        {hour:'numeric',minute:'2-digit'}):(hh?'—':'loading…');

        const
        today=num('sensor.sigen_plant_pv_daily_generation'),yday=num('sensor.sigen_plant_pv_previous_day_generation');

        const tp=today!==null&&yday?Math.min(100,today/yday*100):null;

        const vs=today!==null&&yday?(today>=yday?`Ahead of yesterday’s
        ${yday.toFixed(0)} kWh`:`${Math.round(tp)}% of yesterday’s
        ${yday.toFixed(0)} kWh`):'';

        const self=home>0?Math.max(0,Math.min(100,(1-gi/home)*100)):100;

        const row=(icon,label,val,col,extra)=>`<div class="row"><ha-icon
        icon="${icon}" style="color:${col}"></ha-icon><span
        class="rl">${label}</span><span class="rv"
        style="color:${col}">${val}</span>${extra||''}</div>`;

        const bstate=chg&&bp>T?'charging '+kwt(bp):dis&&bp>T?'supplying
        '+kwt(bp):'standby';

        const panel=`<div class="panel"><div
        class="today"><b>${today!==null?today.toFixed(1):'—'}</b><span>kWh solar
        today</span></div>${tp!==null?`<div class="bar"><i
        style="width:${tp.toFixed(1)}%"></i></div><small
        class="vs">${vs}</small>`:''}

        <div class="rows">${row('mdi:summit','Peak
        today',peakTxt,'#ffe29a')}${row('mdi:home-variant-outline','Home',kwt(home),C.home)}${row(socv<20?'mdi:battery-low':'mdi:home-battery-outline','Battery',(soc!==null?Math.round(socv)+'%':'—')+'
        · '+bstate,bcol)}${row('mdi:transmission-tower','Grid',gi>T?'importing
        '+kwt(gi):ge>T?'exporting
        '+kwt(ge):'idle',gi>T?C.gridIn:C.gridOut)}${row('mdi:leaf','Self-powered',Math.round(self)+'%','#7fd39a')}${row('mdi:lightbulb-group-outline','Lights',lon+'
        of '+total+' on · '+lw.toFixed(0)+'
        W','#ffcf85')}${row(healthy===total?'mdi:shield-check-outline':'mdi:alert-outline','Shelly',healthy+'/'+total+'
        healthy',healthy===total?'#7fd39a':'#ffb547')}</div></div>`;

        const txt=`<div class="txt"><div
        class="when">${date}</div><h1>${greet}</h1><p><span class="dot"
        style="background:${gi>0.2?C.gridIn:pv>0.1?C.solar:C.battery}"></span>${line}</p>${wxLine}${bigEl('bigl')}</div>`;

        return `<div class="sw"><div class="sky"
        style="background:${skyBg}"><div class="stars"
        style="opacity:${(night*(1-0.95*cloud)).toFixed(2)}">${stars}</div>${cl}${hills}<div
        class="scene"
        style="--sxd:${SD.pt[0].toFixed(2)}%;--syd:${SD.pt[1].toFixed(2)}%;--sxm:${SM.pt[0].toFixed(2)}%;--sym:${SM.pt[1].toFixed(2)}%">${glow}${arc}${orb}${bigEl('bigr')}${pylon}${batt}${house}${parts}</div><div
        class="wxfx">${wxfx}</div>${txt}</div>${panel}</div>`;

        ]]]
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - overflow: visible
    extra_styles: >-
      ha-card{min-height:380px}

      @media (max-width:760px){ha-card{min-height:356px}}

      .sw{container-type:inline-size;width:100%;position:relative;text-align:left}

      .sky{position:relative;height:380px;overflow:hidden;border-radius:26px;isolation:isolate}

      .stars,.arc,.hills{position:absolute;inset:0;pointer-events:none}

      .scene{position:absolute;left:0;top:0;bottom:0;right:332px;pointer-events:none;--sx:var(--sxd);--sy:var(--syd);--hx:68%;--rx:36px;--ry:139px;--wx:94px;--wy:130px;--px:90%;--py:132px;--tx:calc(60%
      - 164px);--lx:96px;--ly:100px;--bx:44px;--by:104px}

      .glow{position:absolute;width:520px;height:520px;translate:-50%
      -50%;border-radius:50%}

      .arc{width:100%;height:100%}

      .arc.am{display:none}

      .hills{top:auto;bottom:0;height:120px;width:100%}

      .star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0
      4px #fff;animation:tw ease-in-out infinite}

      @keyframes tw{50%{opacity:.25}}

      .shoot{position:absolute;top:12%;left:18%;width:90px;height:1.5px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-18deg);opacity:0;animation:shoot
      14s linear infinite}

      @keyframes shoot{0%{opacity:0;translate:0
      0}2%{opacity:1}7%{opacity:0;translate:260px
      90px}100%{opacity:0;translate:260px 90px}}

      .cloud{position:absolute;border-radius:999px;filter:blur(14px);animation:drift
      linear infinite}

      .veil{position:absolute;inset:0;pointer-events:none}

      .wxfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}

      .drop{position:absolute;top:-12%;width:1.5px;height:20px;border-radius:1px;background:linear-gradient(180deg,transparent,rgba(205,220,255,.8));animation:rainfall
      linear infinite}

      .drop.hail{width:4px;height:4px;border-radius:50%;background:#e8eef8}

      @keyframes rainfall{from{top:-12%;translate:0
      0}to{top:108%;translate:var(--dx) 0}}

      .flake{position:absolute;top:-6%;border-radius:50%;background:#f4f7ff;opacity:.9;animation:snowfall
      linear infinite}

      @keyframes snowfall{0%{top:-6%;translate:0 0}50%{translate:14px
      0}100%{top:104%;translate:-8px 0}}

      .flash{position:absolute;inset:0;background:#dfe8ff;opacity:0;animation:flash
      9s linear infinite;mix-blend-mode:screen}

      @keyframes
      flash{0%,91%,100%{opacity:0}92%{opacity:.55}93%{opacity:.08}94.5%{opacity:.4}96%{opacity:0}}

      .fog{position:absolute;left:-5%;right:-5%;bottom:0;height:60%;background:linear-gradient(180deg,transparent,rgba(190,198,212,.55)
      55%,rgba(190,198,212,.7));filter:blur(6px)}

      .wx{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:13px;opacity:.9}

      .wx ha-icon{flex:none !important;width:18px !important;height:18px
      !important;--mdc-icon-size:18px !important}

      @keyframes drift{from{translate:-30vw 0}to{translate:30vw 0}}

      .txt .bigl{display:none}

      .bigr{position:absolute;top:26px;right:30px;margin:0;color:#fff;text-shadow:0
      2px 14px rgba(0,0,0,.45)}

      .sunlbl{position:absolute;left:clamp(90px,var(--sx),calc(100% -
      90px));top:var(--sy);translate:-50% calc(-100% -
      40px);display:flex;align-items:flex-end;gap:8px;color:#fff;text-shadow:0
      2px 14px rgba(0,0,0,.45);white-space:nowrap;pointer-events:none}

      .sunlbl.bd{translate:calc(-100% - 46px) -50%}

      .sunlbl
      b{font-size:46px;line-height:.9;font-weight:200;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}

      .sunlbl
      span{font-size:11px;line-height:1.25;opacity:.85;padding-bottom:3px}

      .sun,.moon{position:absolute;width:0;height:0}

      .sun i,.moon
      i{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}

      .sun .disc{width:46px;height:46px;background:radial-gradient(circle at 40%
      38%,#fffaf0,#ffe29a 45%,#ffbf4d 75%);box-shadow:0 0 30px 8px
      rgba(255,200,110,calc(.45*var(--i))),0 0 90px 30px
      rgba(255,170,70,calc(.35*var(--i)))}

