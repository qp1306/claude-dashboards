  hm_esplight:
    template: hm_base
    entity: light.garage_light_garage_light
    custom_fields:
      body: >-
        [[[

        const L={"entity": "light.garage_light_garage_light", "status":
        "binary_sensor.garage_light_garage_light_status", "wifi":
        "sensor.garage_light_wifi_signal_sensor", "timer":
        "timer.garage_light_off", "delay":
        "input_number.garage_light_delay"};const CH=[2, 5, 10, 15, 30, 60];

        const NA=['unknown','unavailable','none',''];

        const e=states[L.entity];const st=states[L.status];

        const
        offline=!e||NA.includes(String(e.state).toLowerCase())||(st&&st.state==='off');

        const on=!offline&&e.state==='on';

        const dbs=states[L.wifi];const
        db=dbs&&!NA.includes(String(dbs.state).toLowerCase())?Number(dbs.state):null;

        const
        q=db===null||!Number.isFinite(db)?null:db>=-55?4:db>=-67?3:db>=-75?2:db>=-85?1:0;

        const wf=q===null?'':`<span class="wf q${q}" title="Wi-Fi
        ${db.toFixed(0)} dBm"><ha-icon
        icon="mdi:wifi-strength-${q?q:'outline'}"></ha-icon></span>`;

        const dl=states[L.delay];const
        cur=dl&&!NA.includes(dl.state)?Math.round(Number(dl.state)):null;

        const tm=states[L.timer];const
        active=!!tm&&tm.state==='active'&&tm.attributes.finishes_at;

        const hms=(s)=>{const p=String(s||'0:0:0').split(':').map(Number);return
        (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);};

        const fin=active?Date.parse(tm.attributes.finishes_at):0;const
        tot=active?Math.max(1,hms(tm.attributes.duration)):1;

        const left=active?Math.max(0,Math.round((fin-Date.now())/1000)):0;

        const fmt=(s)=>{const
        h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return
        (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');};

        const sub=offline?'Offline':!on?'Off':active?`Off in <b
        class="cdt">${fmt(left)}</b>`:'On';

        const auto=cur!==null&&!active&&!offline?`<span class="auto" title="Hold
        to change">⏱ ${cur} min after door closes</span>`:'';

        const bar=active?`<span class="cdbar" aria-hidden="true"><i
        style="--f0:${(left/tot).toFixed(4)};animation-duration:${left}s"></i></span>`:'';

        const menu=`<div class="mn" role="dialog" aria-label="Auto-off
        delay"><div class="mh"><span>Light off after door closes</span><button
        class="x" data-a="close" aria-label="Close">✕</button></div>

        <div class="chips">${CH.map(m=>`<button class="ch ${m===cur?'sel':''}"
        data-m="${m}">${m<60?m+' min':m/60+' h'}</button>`).join('')}</div>

        ${active?'<button class="ch stop" data-a="cancel">Stop countdown · keep
        light on</button>':''}</div>`;

        const card=this;

        if(typeof window!=='undefined'&&card){setTimeout(()=>{try{
         const r=card.shadowRoot;const t=r&&r.querySelector('.t.el');if(!t)return;
         if(card._glMenu)t.classList.add('menu');
         const H=()=>card._hass||(document.querySelector('home-assistant')||{}).hass;
         const mn=t.querySelector('.mn');
         if(mn&&!mn._b){mn._b=1;['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click','contextmenu'].forEach(n=>mn.addEventListener(n,ev=>ev.stopPropagation()));
          mn.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const h=H();
           if(b.dataset.m&&h)h.callService('input_number','set_value',{entity_id:L.delay,value:Number(b.dataset.m)});
           if(b.dataset.a==='cancel'&&h)h.callService('timer','cancel',{entity_id:L.timer});
           card._glMenu=false;t.classList.remove('menu');});}
         clearInterval(card._glTick);
         if(active){card._glTick=setInterval(()=>{const s=Math.max(0,Math.round((fin-Date.now())/1000));const el=card.shadowRoot&&card.shadowRoot.querySelector('.cdt');if(el)el.textContent=fmt(s);if(s<=0)clearInterval(card._glTick);},1000);}
        }catch(err){}},0);}

        return `<div class="t el ${on?'on':''} ${offline?'bad':''}
        ${active?'counting':''}" role="button" aria-label="Garage light,
        ${offline?'offline':on?'on':'off'}${active?', turning off in
        '+fmt(left):''}. Hold for auto-off settings.">

        <span class="ic"><ha-icon
        icon="${on?'mdi:lightbulb-on':'mdi:lightbulb-outline'}"></ha-icon></span>

        <div class="tx"><b>${variables.label}</b><small>${sub}</small><div
        class="tel">${wf}${auto}</div></div>${bar}${menu}</div>`;

        ]]]
    tap_action:
      action: toggle
    hold_action:
      action: javascript
      javascript: >-
        [[[ this._glMenu=!this._glMenu; const
        t=this.shadowRoot&&this.shadowRoot.querySelector('.t.el'); if(t)
        t.classList.toggle('menu', this._glMenu); ]]]
    double_tap_action:
      action: more-info
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: '0'
        - border-radius: 20px
        - overflow: hidden
    extra_styles: >-
      .tx small b{display:inline !important;font-size:inherit
      !important;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}

      .cdbar{position:absolute
      !important;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06);z-index:2
      !important}

      .cdbar
      i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffb648,#ffd877);box-shadow:0
      0 8px rgba(255,190,90,.7);animation:drain linear forwards}

      @keyframes drain{from{width:calc(var(--f0) * 100%)}to{width:0}}

      .mn{display:none;flex-direction:column;gap:8px;cursor:default}

      .t.menu{display:block;min-height:0;padding:12px 14px}

      .t.menu>:not(.mn){display:none !important}

      .t.menu .mn{display:flex}

      .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:#c9d3e4}

      .chips{display:flex;flex-wrap:wrap;gap:6px}

      .ch{font:inherit;font-size:12px;font-weight:600;color:#c9d3e4;padding:6px
      10px;border-radius:999px;border:1px solid
      rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer}

      .ch:hover{border-color:rgba(255,182,72,.5);color:#ffcf85}

      .ch.sel{background:#ffb648;border-color:#ffb648;color:#2a1700}

      .ch.stop{color:#ff9b9b;border-color:rgba(255,107,107,.35)}

      .x{flex:none;font:inherit;font-size:13px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#c9d3e4;cursor:pointer}

      @media (prefers-reduced-motion:reduce){.cdbar
      i{animation:none;width:calc(var(--f0) * 100%)}}

      .t{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:132px;box-sizing:border-box;padding:14px
      15px;border-radius:20px;text-align:left;background:rgba(255,255,255,.035);border:1px
      solid rgba(255,255,255,.07);transition:background .35s,border-color
      .35s,box-shadow .35s,transform
      .15s;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;outline:none}

      .t:focus-visible{box-shadow:0 0 0 2px #ffb648}

      .t:active{transform:scale(.985)}

      .t.press{transform:scale(.97)}

      .t>*{position:relative;z-index:1}

      .lvl{position:absolute !important;z-index:0
      !important;left:0;top:0;bottom:0;width:var(--lvl);background:linear-gradient(90deg,rgba(255,182,72,.10),rgba(255,182,72,.30));border-right:2px
      solid rgba(255,214,140,.0);transition:width .45s
      cubic-bezier(.2,.8,.2,1),border-color .3s;pointer-events:none}

      .t:not(.on) .lvl{width:0}

      .t.dim.on .lvl{border-right-color:rgba(255,214,140,.65);box-shadow:6px 0
      18px -6px rgba(255,190,90,.6)}

      .t.dragging .lvl{transition:none}

      .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:#7d8aa3;transition:all
      .35s}

      .ic ha-icon{flex:none !important;width:23px !important;height:23px
      !important;--mdc-icon-size:23px !important}

      .tx{min-width:0}

      .tx
      b{display:block;font-size:14px;font-weight:600;color:#e7edf7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

      .tx
      small{display:block;font-size:12px;color:#7d8aa3;margin-top:2px;font-variant-numeric:tabular-nums}

      .t.on{background:rgba(255,182,72,.06);border-color:rgba(255,182,72,.45);box-shadow:0
      8px 28px rgba(255,160,40,.14)}

      .t.on:not(.dim){background:linear-gradient(150deg,rgba(255,182,72,.22),rgba(255,182,72,.06))}

      .t.on .ic{background:#ffb648;color:#2a1700;box-shadow:0 0 18px
      rgba(255,182,72,.65)}

      .t.on .tx small{color:#ffcf85}

      .t.bad{border-color:rgba(255,107,107,.4)}

      .t.bad .tx small{color:#ff8c8c}

      .t.fan.on .ic ha-icon{animation:spin 1.6s linear infinite}

      @keyframes spin{to{transform:rotate(360deg)}}

      .tel{display:flex;flex-wrap:wrap;align-items:center;gap:2px
      10px;margin-top:6px;font-size:11px;color:#6f7c95;font-variant-numeric:tabular-nums}

      .tel span{white-space:nowrap}

      .t.on .tel{color:#c9a46a}

      .wf{display:inline-flex;align-items:center}

      .wf ha-icon{flex:none !important;width:14px !important;height:14px
      !important;--mdc-icon-size:14px !important}

      .wf.q4,.wf.q3{color:#7fd39a}.wf.q2{color:#ffb547}.wf.q1,.wf.q0{color:#ff6b6b}

      .corner{position:absolute
      !important;top:13px;right:13px;display:flex;align-items:center;gap:6px}

      .hint{display:inline-flex;color:rgba(255,255,255,.22);transition:color
      .3s}

      .hint ha-icon{flex:none !important;width:18px !important;height:18px
      !important;--mdc-icon-size:18px !important}

      .t:hover .hint,.t.dragging .hint{color:#ffcf85}

      .flag{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#ffb547;color:#2a1a00}

      @media (prefers-reduced-motion:reduce){.t.fan.on .ic
      ha-icon{animation:none}.lvl{transition:none}}

      .t.el{flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:84px}

      .t.el .tx{flex:1}.t.el .tel{margin-top:4px;gap:2px 12px}

      .t.el .tx small
      b{display:inline;font-size:inherit;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.3px}

      .auto{font-size:11px;color:#6f7c95}.t.on .auto{color:#c9a46a}

      .cdbar{position:absolute
      !important;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06);z-index:2
      !important}

      .cdbar
      i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffb648,#ffd877);box-shadow:0
      0 8px rgba(255,190,90,.7);animation:drain linear forwards}

      @keyframes drain{from{width:calc(var(--f0) * 100%)}to{width:0}}

      .mn{position:absolute !important;inset:0;z-index:5
      !important;display:none;flex-direction:column;justify-content:center;gap:9px;padding:10px
      14px;background:rgba(12,17,30,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:20px;cursor:default}

      .t.el.menu{display:block;min-height:0;padding:12px 14px}

      .t.el.menu>:not(.mn){display:none !important}

      .t.menu .mn{display:flex;position:static
      !important;inset:auto;padding:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}

      .mh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:#c9d3e4}

      .chips{display:flex;flex-wrap:wrap;gap:6px}

      .ch{font:inherit;font-size:12px;font-weight:600;color:#c9d3e4;padding:6px
      11px;border-radius:999px;border:1px solid
      rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer}

      .ch:hover{border-color:rgba(255,182,72,.5);color:#ffcf85}

      .ch.sel{background:#ffb648;border-color:#ffb648;color:#2a1700}

      .ch.stop{align-self:flex-start;color:#ff9b9b;border-color:rgba(255,107,107,.35)}

      .x{font:inherit;font-size:13px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#c9d3e4;cursor:pointer}

      @media (prefers-reduced-motion:reduce){.cdbar
      i{animation:none;width:calc(var(--f0) * 100%)}}
