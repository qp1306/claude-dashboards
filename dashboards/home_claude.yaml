      currentColor}

      .big{display:flex;align-items:flex-end;gap:10px;margin-top:16px}

      .big
      b{font-size:60px;line-height:.9;font-weight:200;letter-spacing:-2px;font-variant-numeric:tabular-nums}

      .big span{font-size:12px;line-height:1.25;opacity:.85;padding-bottom:4px}

      .panel{position:absolute;right:16px;top:16px;bottom:16px;width:300px;box-sizing:border-box;padding:18px
      18px
      14px;border-radius:20px;background:rgba(10,16,32,.42);backdrop-filter:blur(18px)
      saturate(140%);-webkit-backdrop-filter:blur(18px)
      saturate(140%);border:1px solid
      rgba(255,255,255,.12);color:#eef3fb;display:flex;flex-direction:column}

