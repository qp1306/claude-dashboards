      65%);animation:breathe 5s ease-in-out infinite}

      @keyframes breathe{50%{scale:1.15;opacity:.75}}

      .sun
      .rays{width:260px;height:260px;background:repeating-conic-gradient(from
      0deg,rgba(255,230,170,calc(.16*var(--i))) 0 4deg,transparent 4deg
      18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent
      62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin
      60s linear infinite}

      @keyframes spin{to{rotate:360deg}}

      .moon .mdisc{width:34px;height:34px;background:radial-gradient(circle at
      35% 35%,#f5f7ff,#c9d3ea 60%,#9aa7c7);box-shadow:inset -8px -4px 0
      rgba(0,0,0,.18)}

      .moon
      .mglow{width:120px;height:120px;background:radial-gradient(circle,rgba(200,215,255,.22),transparent
      65%)}

      .house{position:absolute;left:var(--hx);bottom:58px;width:216px;height:144px;translate:-50%
      0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}

