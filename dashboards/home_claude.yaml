      @keyframes glint{0%,70%,100%{fill:#2c4f8f}80%{fill:#ffe7a8}}

      .wall{position:absolute;left:var(--tx);bottom:56px;width:40px;height:94px;box-sizing:border-box;border-radius:12px;background:linear-gradient(180deg,#f2f5f9,#cdd4df);box-shadow:inset
      0 -2px 0 rgba(0,0,0,.12),0 8px 14px rgba(0,0,0,.35)}

      .wall
      .led{position:absolute;left:50%;top:7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--bc);box-shadow:0
      0 6px var(--bc)}

      .wall
      .wbar{position:absolute;left:50%;top:17px;bottom:11px;width:7px;margin-left:-3.5px;display:flex;flex-direction:column;gap:3px}

      .wall
      .seg{position:relative;flex:1;border-radius:3px;background:rgba(40,52,74,.28);overflow:hidden}

      .wall
      .seg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--f)
      * 100%);background:var(--bc);box-shadow:0 0 8px var(--bc)}

      .wall .seg.act::after{height:100%;animation:modpulse 1.6s ease-in-out
      infinite}

      @keyframes modpulse{0%,100%{opacity:.25}50%{opacity:1}}

      .pylon{position:absolute;left:var(--px);bottom:62px;width:34px;height:84px;translate:-50%
      0;opacity:.9}

      .pt{position:absolute;width:5px;height:5px;margin:-2.5px 0 0
      -2.5px;border-radius:50%;animation:fly linear infinite;opacity:0}

      .pt.sun{background:#fff3c4;box-shadow:0 0 8px 2px rgba(255,200,90,.85)}

      .pt.exp{background:#dbe4ff;box-shadow:0 0 8px 2px rgba(142,166,255,.9)}

      .pt.imp{background:#ffd0d0;box-shadow:0 0 8px 2px rgba(255,107,107,.9)}

      .pt.batf{background:#d6ffe9;box-shadow:0 0 8px 2px rgba(62,224,143,.95)}

      /* smooth arcs: x moves steadily while y eases up to the apex and back
      down, giving a true curve */

      .pt.batf,.pt.exp,.pt.imp{animation-name:arcx,arcy,arco;animation-timing-function:linear;animation-iteration-count:infinite}

      @keyframes arcx{0%{left:var(--x0)}100%{left:var(--x1)}}

      @keyframes
      arcy{0%{top:var(--y0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{top:var(--ym);animation-timing-function:cubic-bezier(.6,0,.8,.4)}100%{top:var(--y1)}}

      @keyframes arco{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}

      /* battery dots: straight line between the house wall and the battery */

      .pt.batf{animation-name:linexy,arco}

      @keyframes
      linexy{0%{left:var(--x0);top:var(--y0)}100%{left:var(--x1);top:var(--y1)}}

      @keyframes
      fly{0%{left:var(--x0);top:var(--y0);opacity:0}10%{opacity:1}50%{left:var(--xm);top:var(--ym)}90%{opacity:1}100%{left:var(--x1);top:var(--y1);opacity:0}}

      .txt{position:absolute;left:26px;top:22px;max-width:46%;color:#fff;text-shadow:0
      2px 14px rgba(0,0,0,.45)}

