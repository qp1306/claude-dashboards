  hm_room:
    template: hm_base
    custom_fields:
      body: >-
        [[[

        const NA=['unknown','unavailable','none',''];

        const num=(id)=>{if(!id)return null;const
        o=states[id];if(!o||NA.includes(String(o.state).toLowerCase()))return
        null;const n=Number(o.state);return Number.isFinite(n)?n:null;};

        const reg=(typeof
        hass!=='undefined'&&hass&&hass.entities)?hass.entities:{};

        const devOf=(id)=>id&&reg[id]?reg[id].device_id:null;

        const find=(d,dom,test,diag)=>{const
        did=devOf(d.temp)||devOf(d.wifi)||devOf(d.power)||devOf(d.entity)||devOf(d.stats);if(!did)return
        null;return
        Object.keys(reg).find(k=>reg[k].device_id===did&&k.startsWith(dom+'.')&&(diag||!reg[k].entity_category)&&states[k]&&test(states[k]))||null;};

        const resolve=(d)=>{const
        r=Object.assign({},d);if(!states[d.entity]){const
        dom=d.entity.split('.')[0];const
        f=find(d,dom,()=>true,false);if(f)r.entity=f;}const
        dc=(o)=>o.attributes.device_class;if(d.power&&!states[d.power]){const
        f=find(d,'sensor',(o)=>dc(o)==='power',true);if(f)r.power=f;}if(d.temp&&!states[d.temp]){const
        f=find(d,'sensor',(o)=>dc(o)==='temperature',true);if(f)r.temp=f;}if(d.wifi&&!states[d.wifi]){const
        f=find(d,'sensor',(o)=>dc(o)==='signal_strength',true);if(f)r.wifi=f;}return
        r;};

        const dev=(d0)=>{const d=resolve(d0);const e=states[d.entity];const
        missing=!e;const s=e?e.state:'missing';const
        pw=num(d.power),tc=num(d.temp),db=num(d.wifi);const
        silent=(d.temp||d.wifi)?(tc===null&&db===null):true;const
        offline=(missing&&silent)||(!missing&&NA.includes(String(s).toLowerCase()));const
        sx=states[d.stats];const
        a=sx&&!NA.includes(String(sx.state).toLowerCase())?sx.attributes:null;const
        an=(k)=>a&&a[k]!==undefined&&a[k]!==null&&a[k]!==''&&Number.isFinite(Number(a[k]))?Number(a[k]):null;const
        clk=states[d.clock]?states[d.clock].state:'unavailable';const
        starts=an('onCount');const rt=an('runtimeSeconds');const
        clockOk=clk==='Healthy';let issue=null;if(offline)issue='offline';else
        if(missing)issue='entity missing';else if(starts===null)issue='no
        stats';else if(!clockOk)issue='clock '+String(clk).toLowerCase();return
        Object.assign({},d,{s,on:s==='on',offline,missing:missing&&!offline,starts,rt,in0:an('input0'),in1:an('input1'),pw,tc,db,clk,clockOk,reporting:!offline&&starts!==null,healthy:issue===null,issue});};

        const all=variables.devices.map(dev);

        const fmt=(n)=>n===null?'—':n.toLocaleString();

        const hrs=(s)=>s===null?'—':(s/3600).toFixed(1)+' h';

        const list=all.filter(x=>x.group===variables.group);

        const XE=(variables.extra||[]).filter(e=>states[e]);const
        on=list.filter(x=>x.on).length+XE.filter(e=>states[e].state==='on').length;

        const w=list.filter(x=>x.pw!==null).reduce((t,x)=>t+x.pw,0);

        const bad=list.filter(x=>!x.healthy).length;

        return `<div class="rh"><span class="ri"><ha-icon
        icon="${variables.icon}"></ha-icon></span><div
        class="rt"><b>${variables.title}</b><small>${!list.length?(variables.subtitle||''):on?on+'
        of '+(list.length+XE.length)+' on, '+w.toFixed(0)+' W':'All
        off'}${bad?`<em> · ${bad} need${bad>1?'':'s'}
        attention</em>`:''}</small></div></div>`;

        ]]]
